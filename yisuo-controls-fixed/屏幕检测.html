<!doctype html><html lang="zh-CN"><script src="browser-compat.js?v=controls22"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>屏幕检测</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#102b2e;color:#f1e6d0;font:18px/1.8 system-ui}main{max-width:900px;margin:auto}h1{font-size:30px}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dt,dd{margin:0;border-bottom:1px solid #b6976255;padding:8px}button,a{font:inherit;background:#e4c28c;color:#243737;padding:12px 20px;border:0;border-radius:4px;display:inline-block;margin:6px 12px 6px 0;text-decoration:none}p{font-size:16px}</style><main><h1>当前设备屏幕检测</h1><p>请在实际使用的一体机上打开本页。排版以浏览器可用区域为准。</p><dl id="info"></dl><button id="full">切换全屏</button><a href="index.html">进入游戏</a><p>CSS 像素与面板物理像素可能因系统缩放而不同。网页无法准确获取屏幕英寸；英寸数应以屏幕铭牌为准。</p></main><script>function update(){const rows=[['浏览器可用区域',innerWidth+' × '+innerHeight+' CSS 像素'],['系统报告的屏幕尺寸',screen.width+' × '+screen.height+' CSS 像素'],['设备像素比',devicePixelRatio],['按像素比估算的屏幕尺寸',Math.round(screen.width*devicePixelRatio)+' × '+Math.round(screen.height*devicePixelRatio)+' 像素（估算）'],['画面方向',innerWidth>=innerHeight?'横屏':'竖屏'],['全屏状态',document.fullscreenElement?'已全屏':'未全屏']];document.querySelector('#info').innerHTML=rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('')}update();addEventListener('resize',update);document.addEventListener('fullscreenchange',update);document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.querySelector('#full').textContent='请使用浏览器菜单开启全屏'}};</script></html>
