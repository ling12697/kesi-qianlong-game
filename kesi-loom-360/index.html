function project(p){let [x,y,z]=camera([p[0]*.78,p[1]*1.06,p[2]]),scale=Math.min(canvas.width,canvas.height)*.84*zoom/z;return [canvas.width/2+x*scale+panX*dpr,canvas.height*.53-y*scale+panY*dpr,z]}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.clearRect(0,0,canvas.width,canvas.height);let faces=[];for(const [g,objs] of Object.entries(groups)){if(hidden.has(g))continue;for(const ob of objs){if(ob.type!=='faces')continue;for(const f of ob.polys){let pts=f.pts.map(project);let avg=pts.reduce((s,p)=>s+p[2],0)/pts.length;let n=f.n,[nx,ny,nz]=n;let light=Math.max(.43,Math.min(1.13,.68+(-.5*nx-.6*ny+.62*nz)*.38));faces.push({pts,depth:avg,color:f.color,light,group:g})}}}
faces.sort((a,b)=>b.depth-a.depth);for(const f of faces){ctx.beginPath();ctx.moveTo(f.pts[0][0],f.pts[0][1]);for(let i=1;i<f.pts.length;i++)ctx.lineTo(f.pts[i][0],f.pts[i][1]);ctx.closePath();let highlighted=active===f.group;ctx.fillStyle=rgba(f.color,f.light,highlighted?.86:.99);ctx.fill();ctx.strokeStyle=wire?'#47372a88':(highlighted?'#a44327aa':'#48352320');ctx.lineWidth=wire?1.2*dpr:.65*dpr;ctx.stroke()}
drawGround();drawLabels();requestAnimationFrame(draw)}
function drawGround(){let corners=[[-2.1,-1.5,0],[2.1,-1.5,0],[2.1,1.5,0],[-2.1,1.5,0]].map(project);ctx.beginPath();ctx.moveTo(...corners[0]);corners.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='#c6b18d12';ctx.fill();}
const labels=[['frame','机架',[-1.55,-.98,2.46]],['rollers','前轴 / 卷布轴',[0,-.79,1.55]],['warp','经面',[0,.23,2.06]],['reed','钢筘',[.75,-.08,2.29]],['heddle','翻头 / 提综',[.64,.18,2.53]],['ropes','吊绳',[.7,.04,2.87]],['shuttles','挂梭板',[.7,.7,2.77]],['pedals','足踏竹棒',[.32,-.2,.22]],['tray','图样托盘',[0,-.34,1.25]]];
function drawLabels(){let stageRect=stage.getBoundingClientRect();for(const [g,name,p] of labels){let id='hot-'+g;let e=document.getElementById(id);if(!labelsOn||hidden.has(g)){if(e)e.remove();continue}if(!e){e=document.createElement('div');e.id=id;e.className='hotspot';e.textContent=name;stage.appendChild(e)}let q=project(p);e.style.left=(q[0]/dpr)+'px';e.style.top=(q[1]/dpr-5)+'px';e.style.opacity=q[2]<focal+.35?'0':'1';}}
function setView(name,a,p){yaw=a;pitch=p;active=null;document.getElementById('viewName').textContent=name;document.getElementById('viewDesc').textContent='木构手工缂丝织机 · 静态结构示意'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function buildParts(){const el=document.getElementById('parts');for(const [g,n,desc,col] of meta){let row=document.createElement('div');row.className='part';row.style.setProperty('--wood',col);row.innerHTML=`<span class="dot"></span><div><strong>${n}</strong><small>${desc}</small></div><input type="checkbox" checked aria-label="显示${n}">`;row.addEventListener('click',e=>{if(e.target.tagName==='INPUT'){if(e.target.checked)hidden.delete(g);else hidden.add(g);return}active=active===g?null:g;document.getElementById('viewName').textContent=active?n:'整机结构';document.getElementById('viewDesc').textContent=active?desc:'木构手工缂丝织机 · 静态结构示意';let aim={frame:[-.68,.2],rollers:[-.35,.1],warp:[-.4,.2],reed:[-.35,.15],heddle:[-.35,.15],ropes:[-.68,.2],shuttles:[.1,.2],pedals:[-.7,-.05],tray:[-.65,.05]}[g];if(aim){yaw=aim[0];pitch=aim[1]}toast(active?'聚焦：'+n:'已取消聚焦')});el.appendChild(row)}}
buildParts();draw();
document.getElementById('front').onclick=()=>setView('正面',Math.PI,.02);document.getElementById('side').onclick=()=>setView('侧面',Math.PI/2,.04);document.getElementById('back').onclick=()=>setView('背面',0,.02);document.getElementById('reset').onclick=()=>{yaw=Math.PI-.68;pitch=.2;zoom=1;panX=panY=0;active=null;setView('整机结构',yaw,pitch)};document.getElementById('wire').onclick=e=>{wire=!wire;e.currentTarget.classList.toggle('active',wire);toast(wire?'线框强调已开启':'线框强调已关闭')};document.getElementById('labels').onclick=()=>{labelsOn=!labelsOn;toast(labelsOn?'部件标注已开启':'部件标注已关闭')};document.getElementById('showAll').onclick=()=>{hidden.clear();document.querySelectorAll('.part input').forEach(x=>x.checked=true);toast('已显示全部部件')};document.getElementById('hideAll').onclick=()=>{hidden=new Set(['rollers','warp','reed','heddle','ropes','shuttles','pedals','tray']);document.querySelectorAll('.part').forEach((row,i)=>row.querySelector('input').checked=!hidden.has(meta[i][0]));toast('已突出显示木构机架')};
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY,shift:e.shiftKey};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(e.buttons===2||drag.shift){panX=drag.px+dx;panY=drag.py+dy}else{yaw+=dx*.009;pitch=Math.max(-1.0,Math.min(1.12,pitch+dy*.008))}});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.58,Math.min(1.8,zoom*Math.exp(-e.deltaY*.001)))},{passive:false});window.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')document.getElementById('reset').click();if(e.key==='l'||e.key==='L')document.getElementById('labels').click()});window.addEventListener('resize',()=>{});
})();
</script></body></html>
