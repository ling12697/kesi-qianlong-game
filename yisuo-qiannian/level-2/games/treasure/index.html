<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局部寻宝 · 循纹定位</title><link rel="stylesheet" href="hunt.css?v=smooth18"><main><header><div><small>缂丝图像观察</small><h1>局部寻宝</h1></div><div id="actionCue" class="action-cue" role="status" aria-live="polite"></div><div class="progress"><span id="progress">准备纹样…</span><div class="rail"><i id="fill"></i></div></div></header><section id="play"><aside><div class="step" id="step">第一步 · 辨认来源</div><h2 id="label">正在准备图像</h2><div class="clue-wrap"><canvas id="clue" aria-label="待寻找的局部纹样"></canvas><span>线索原图 · 保留纹理</span></div><p id="instruction">观察这处纹样，在右侧选择它来自的画作。</p><div id="feedback" role="status" aria-live="polite">图片准备好后即可开始。</div><button id="hint">给我一点线索</button><div id="tokens" aria-label="本轮已找到纹样"></div></aside><div class="workspace"><div id="choices" class="choices"></div><section id="locate" hidden><div class="locate-bar"><button id="back">← 重新选画</button><span id="locateName"></span><small>点选位置 · 可用方向键与回车定位</small></div><div class="art-area"><div id="artSurface" tabindex="0" role="button" aria-label="在画作中点击纹样位置；键盘方向键移动定位点，回车确认"><img id="full" alt="选中的完整佛像画作" draggable="false"><div id="wash" hidden></div><div id="target" hidden></div><div id="ripple" hidden></div><div id="reticle" hidden>＋</div></div></div></section><div class="round-toast" id="toast" hidden></div></div></section><section id="result" hidden><div id="collection"></div><button id="returnStory" hidden></button><button id="restart" hidden></button></section></main><script src="hunt.js?v=smooth18"></script></html>
