<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#302116">
  <link rel="preload" as="image" href="../treasure/assets/art1-hd.webp"><title>缂丝文物拼图</title>
  <link rel="stylesheet" href="puzzle.css?v=smooth18">
<script src="../../../scene-loader.js?v=smooth18"></script></head>
<body>
  <main class="game">
    <header class="topbar" style="grid-template-columns:1fr auto">
      <div class="heading"><span class="seal">织</span><span><b>佛像拼图</b></span></div>
    </header>
    <section class="puzzle-screen" aria-label="佛像拼图游戏">
      <div class="puzzle-body">
        <div class="board-panel"><h2 class="panel-title">拼图</h2><div class="board-wrap"><div class="board" id="board" aria-label="佛像拼图板"></div><img class="reveal-image" id="revealImage" src="../treasure/assets/art1-hd.webp" alt="繁本《缂丝无量寿尊佛》轴完整原图" hidden></div>
        </div>
        <figure class="reference-panel" aria-label="完整参考图，所有难度均可对照">
          <figcaption class="panel-title">参考图</figcaption>
          <div class="reference-image-link"><img class="reference-image" src="../treasure/assets/art1-hd.webp" alt="故宫博物院藏繁本《缂丝无量寿尊佛》轴，完整拼图参考" width="1342" height="2001"></div>
          <div class="reference-controls">
            <label for="difficulty">难度</label>
            <select id="difficulty"><option value="6">简单 · 6 块</option><option value="12" selected>普通 · 12 块</option><option value="20">挑战 · 20 块</option></select>
            <button class="restart" id="restart" type="button">重新开始</button>
            <div class="piece-status" id="pieceStatus">0 / 12 块在正确位置</div>
            <p class="control-note">拖动或点选两块，交换位置。</p>
            <div class="selected-note" id="selectedNote" hidden>选择一块，再选择另一块交换</div>
          </div>
        </figure>
      </div>
      <div class="complete" id="complete" hidden><div class="complete-card"><span class="gold-star">✦</span><h2>拼图完成</h2><button id="playAgain" type="button">再玩一次</button><button id="chooseDifficulty" type="button">选择难度</button><button id="returnToDesk" type="button">呈回全幅画样 →</button></div></div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="puzzle.js?v=smooth18"></script>
</body>
</html>
