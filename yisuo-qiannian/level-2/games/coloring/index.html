<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藏传佛教建筑模型</title><link rel="stylesheet" href="coloring.css?v=3d3"></head><body>
<header><div><h1>藏传佛教建筑模型</h1></div></header>
<main><section class="stage" aria-label="藏传佛教建筑模型设色"><div class="stage-top"><span id="modeLabel">三维配色参考 · 可自由旋转</span></div><canvas id="modelView" aria-label="可自由旋转缩放的大乘阁三维建筑"></canvas><details class="view-options"><summary>观察工具</summary><div class="view-controls"><button hidden data-tool="rotate" aria-pressed="true">自由旋转</button><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><button id="zoomIn" aria-label="放大模型">＋</button><button id="zoomOut" aria-label="缩小模型">−</button><button id="home">初始视角</button></div></details><div class="stage-bottom"><span id="hover">拖动模型自由旋转，观察完整建筑</span></div></section>
<aside><div id="paintGuide" class="paint-guide" role="status"><b id="guideTitle">① 选择一种颜色</b><span id="guideText">点选下方色卡，对应待上色构件会亮起青蓝色。</span></div><div class="display-modes" hidden><button id="referenceMode" aria-pressed="true">参考配色</button><button id="colorMode" aria-pressed="false">进入上色</button></div><button hidden id="cutaway" aria-pressed="false" class="section-button">查看建筑剖视</button><div id="modelInfo" hidden></div><div class="progress-label"><b id="progressText">正在建立三维建筑…</b><span id="percent">0%</span></div><progress id="progress" max="20" value="0"></progress><div id="palette" class="palette" aria-label="实物参考固定色卡"></div><button id="paintCategory" class="primary">为本类全部构件上色</button><div id="feedback" role="status" aria-live="polite">正在准备三维构件…</div><div class="actions"><button id="undo" disabled>撤销</button><button id="redo">重新上色</button><button id="save" hidden aria-hidden="true"></button></div><div hidden aria-hidden="true"><details open><summary>对照实物资料 <span>图版 77—78</span></summary><button id="photoOpen" class="photo-button"><img loading="lazy" src="references/exterior.jpg" alt="大乘阁现存外观照片，图版77正面、图版78侧面"><span>点击放大照片 ↗</span></button><div class="reference-links"><button id="frontBackPhotos">正背实拍</button><button id="crossSection">横剖面</button><button id="longSection">纵剖面</button></div><p class="source-note">实拍照片与结构图用于校正形制及配色；构件和彩画细节作教学简化。</p><button id="cutawayOpen" class="text-button">对照结构剖视图 ↗</button></details></div></aside></main>

<dialog id="referenceDialog"><button id="closeReference" aria-label="关闭参考图">关闭 ×</button><img id="largeReference" alt="参考资料放大图"><p id="referenceCaption"></p></dialog>
<dialog id="exportDialog"><button id="closeExport">关闭 ×</button><h2>大乘阁上色图</h2><img id="exportImage" alt="当前视角的上色图预览" style="display:block;max-width:80vw;max-height:65dvh"><p>点击下载 PNG；也可以长按或右键图片保存。</p><a id="downloadImage" download="大乘阁-固定配色上色图.png">下载 PNG 图片</a></dialog>
<dialog id="resetDialog"><h2>重新开始上色？</h2><p>清空全部三维构件的上色进度，可撤销恢复。</p><div class="reset-dialog-actions"><button id="cancelReset">继续上色</button><button id="confirmReset" class="primary">重新上色</button></div></dialog>
<script type="module" src="app.js?v=roof3"></script></body></html><script>(()=>{'use strict';
const cache=new Map();let generation=0,timer,loadingTimer,mediaId=0;
function rescue(img){if(img.dataset.kesiRetryAttached)return;img.dataset.kesiRetryAttached='1';let n=0;img.addEventListener('error',()=>{if(n++>=2||!img.src||img.src.startsWith('data:'))return;const u=img.src.replace(/([?&])image_retry=[^&]+/g,'$1').replace(/[?&]$/,'');setTimeout(()=>{img.src=u+(u.includes('?')?'&':'?')+'image_retry='+n+'_'+Date.now()},500)})}
const nativeSrc=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');Object.defineProperty(HTMLImageElement.prototype,'src',{...nativeSrc,set(value){rescue(this);nativeSrc.set.call(this,value)}});
const box=document.createElement('div');box.className='kesi-media';box.hidden=true;box.setAttribute('role','status');box.innerHTML='<div><p class="media-copy"></p><button type="button" hidden>重试图片</button></div>';
const style=document.createElement('style');style.textContent='.kesi-media[hidden]{display:none!important}.kesi-media{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#102b2ef5;color:#f1e6d0;text-align:center;font:16px/1.8 system-ui,sans-serif;padding:24px}.kesi-media p{color:inherit!important}.kesi-media button{background:#e4c28c;color:#183a3c;border:1px solid #d6b071;padding:10px 24px;font:inherit;cursor:pointer}.kesi-media button[hidden]{display:none}';document.head.append(style);document.body.append(box);
const copy=box.querySelector('p'),button=box.querySelector('button');
button.onclick=()=>{for(const [u,p] of cache)if(p.failed)cache.delete(u);scan()};
function load(url,attempt=0){return new Promise(resolve=>{let im=new Image(),timeout;im.dataset.kesiRetryAttached='1';const address=attempt?url+(url.includes('?')?'&':'?')+'image_retry='+attempt+'_'+Date.now():url;let finished=false;function finish(ok){if(finished)return;finished=true;clearTimeout(timeout);im.onload=im.onerror=null;im=null;if(ok)resolve({ok:true,url:address});else if(attempt<2)load(url,attempt+1).then(resolve);else resolve({ok:false,url})}im.onload=()=>finish(im.naturalWidth>0);im.onerror=()=>finish(false);timeout=setTimeout(()=>finish(false),12000);im.src=address;if(im.complete&&im.naturalWidth)finish(true)})}
function get(url){if(!cache.has(url)){const p=load(url);cache.set(url,p);p.then(r=>{p.failed=!r.ok})}return cache.get(url)}
function visible(el){const r=el.getBoundingClientRect();if(!r.width||!r.height)return false;const s=getComputedStyle(el);return s.visibility!=='hidden'&&s.display!=='none'}
function collect(){const groups=new Map();function add(url,apply){if(!url||url.startsWith('data:')||url.startsWith('blob:')||url.startsWith('#'))return;try{url=new URL(url,document.baseURI).href}catch{return}if(!groups.has(url))groups.set(url,[]);groups.get(url).push(apply)}
for(const el of document.body.querySelectorAll('*')){if(el.closest('.kesi-media')||!visible(el))continue;if(el.tagName.toLowerCase()==='image')add(el.getAttribute('href')||el.getAttribute('xlink:href'),u=>el.setAttribute('href',u));if(el.tagName==='IMG'){rescue(el);add(el.currentSrc||el.src,u=>{if(el.isConnected&&el.src!==u)el.src=u})};for(const pseudo of [null,'::before','::after']){const bg=getComputedStyle(el,pseudo).backgroundImage;if(!bg||bg==='none')continue;for(const match of bg.matchAll(/url\(["']?([^"')]+)["']?\)/g)){const original=match[1];add(original,u=>{if(!el.isConnected||u===original)return;cache.set(u,Promise.resolve({ok:true,url:u}));if(pseudo){if(!el.dataset.kesiMediaId)el.dataset.kesiMediaId=String(++mediaId);style.sheet.insertRule('[data-kesi-media-id="'+el.dataset.kesiMediaId+'"]'+pseudo+'{background-image:'+bg.replace(original,u)+'!important}',style.sheet.cssRules.length)}else el.style.setProperty('background-image',bg.replace(original,u),'important')})}}}return groups}
async function scan(){const groups=collect(),id=++generation;clearTimeout(loadingTimer);button.hidden=true;let done=0,failed=0;const entries=[...groups];if(!entries.length){box.hidden=true;return}const pending=entries.some(([u])=>!cache.has(u)||cache.get(u).failed);if(pending)loadingTimer=setTimeout(()=>{if(id===generation){box.hidden=false;copy.textContent='正在准备完整画面 '+done+'/'+entries.length+'…'}},180);
await Promise.all(entries.map(async([url,apply])=>{const r=await get(url);if(id!==generation)return;done++;if(r.ok)apply.forEach(fn=>fn(r.url));else failed++;if(!box.hidden)copy.textContent='正在准备完整画面 '+done+'/'+entries.length+'…'}));if(id!==generation)return;clearTimeout(loadingTimer);if(failed){box.hidden=false;copy.textContent='还有 '+failed+' 张图片未能下载完成，请点重试。';button.hidden=false}else box.hidden=true}
function schedule(){clearTimeout(timer);timer=setTimeout(scan,100)}
new MutationObserver(records=>{if(records.some(r=>!r.target.closest?.('.kesi-media')&&(r.type==='childList'||r.attributeName==='src'||r.attributeName==='class'||(r.attributeName==='style'&&r.target.getAttribute('style')?.includes('url(')))))schedule()}).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','src','style']});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule,{once:true});else schedule();
})();
</script>
