<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藏传佛教建筑模型</title><link rel="stylesheet" href="coloring.css?v=smooth19"><script src="../../../scene-loader.js?v=smooth19"></script></head><body>
<header><div><h1>藏传佛教建筑模型</h1></div></header>
<main><section class="stage" aria-label="藏传佛教建筑模型设色"><div class="stage-top"><span id="modeLabel">三维配色参考 · 可自由旋转</span></div><canvas id="modelView" aria-label="可自由旋转缩放的大乘阁三维建筑"></canvas><details class="view-options"><summary>观察工具</summary><div class="view-controls"><button hidden data-tool="rotate" aria-pressed="true">自由旋转</button><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><button id="zoomIn" aria-label="放大模型">＋</button><button id="zoomOut" aria-label="缩小模型">−</button><button id="home">初始视角</button></div></details><div class="stage-bottom"><span id="hover">拖动模型自由旋转，观察完整建筑</span></div></section>
<aside><div id="paintGuide" class="paint-guide" role="status"><b id="guideTitle">① 选择一种颜色</b><span id="guideText">点选下方色卡，对应待上色构件会亮起青蓝色。</span></div><div class="display-modes" hidden><button id="referenceMode" aria-pressed="true">参考配色</button><button id="colorMode" aria-pressed="false">进入上色</button></div><button hidden id="cutaway" aria-pressed="false" class="section-button">查看建筑剖视</button><div id="modelInfo" hidden></div><div class="progress-label"><b id="progressText">正在建立三维建筑…</b><span id="percent">0%</span></div><progress id="progress" max="20" value="0"></progress><div id="palette" class="palette" aria-label="实物参考固定色卡"></div><button id="paintCategory" class="primary">为本类全部构件上色</button><div id="feedback" role="status" aria-live="polite">正在准备三维构件…</div><div class="actions"><button id="undo" disabled>撤销</button><button id="redo">重新上色</button></div></aside></main>
<dialog id="resetDialog"><h2>重新开始上色？</h2><p>清空全部三维构件的上色进度，可撤销恢复。</p><div class="reset-dialog-actions"><button id="cancelReset">继续上色</button><button id="confirmReset" class="primary">重新上色</button></div></dialog>
<script type="module" src="app.js?v=smooth19"></script></body></html>
