function prepareAction(){silenceAudience();if(chapter!==0){openGame();return}step='action';const box=document.querySelector('#interaction');box.className='pov-action';box.innerHTML=`<div class="edict"><small>御前批示</small><h2>着呈藏传佛教建筑模型</h2><p>${decree}</p><div id="dropTarget" class="stamp-target">用印处</div></div><button id="dragObject" class="vermilion-seal" aria-label="拖动御印到用印处">御<br>览</button>`;setActionHint('#dragObject','拖至用印处 · 或按回车');wireDrag()}

function wireDrag(){const obj=document.querySelector('#dragObject'),target=document.querySelector('#dropTarget');let active=false,start=null;obj.onpointerdown=e=>{e.preventDefault();active=true;start={x:e.clientX,y:e.clientY};obj.setPointerCapture(e.pointerId);obj.classList.add('dragging')};obj.onpointermove=e=>{if(!active)return;obj.style.transform=`translate(${e.clientX-start.x}px,${e.clientY-start.y}px)`;const r=target.getBoundingClientRect();target.classList.toggle('ready',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)};obj.onpointerup=e=>{if(!active)return;active=false;const r=target.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){target.classList.add('applied');target.textContent=chapter===0?'御览':'样片已就位';obj.style.visibility='hidden';resolveAction()}else{obj.style.transform='';target.classList.remove('ready');document.querySelector('#intent').textContent='尚未放入框选处，请再拖一次。'}};obj.onpointercancel=()=>{active=false;obj.style.transform=''};obj.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();target.classList.add('applied');target.textContent=chapter===0?'御览':'样片已就位';obj.style.visibility='hidden';resolveAction()}}}
function finishExperience(){viewed.add(chapter);mode='outro';step='report';renderDialogue()}
function openReport(){const c=audience[chapter];document.querySelector('#povObjects').innerHTML='';const box=document.querySelector('#interaction');box.className='pov-document report-paper';box.innerHTML=`<small>朕已阅 · ${c.after}</small><h2>${['建筑模型已阅','陈设图样已阅','局部既明，再览全幅','经纬成章，奉旨收卷'][chapter]}</h2><p>${c.returning}</p>${chapter===0?'<p class="chosen-decree">此次批示：'+(decree||'审阅建筑方案')+'</p>':''}<button class="primary guided" onclick="nextChapter()">${['取陈设图样 →','取十九年旧样 →','取全幅画卷 →','收卷 →'][chapter]}</button>`;document.querySelector('#intent').textContent='这份回奏，记录了你刚才亲自审阅的事项。'}
function nextChapter(){clearInterval(povTimer);if(chapter<3)jump(chapter+1);else ending()}
function enterThirdChapter(event){if(window.parent!==window){event.preventDefault();window.parent.postMessage({type:'kesi-enter-third'},location.origin);return false}return true}
function ending(){clearInterval(povTimer);mode='end';document.body.classList.remove('playing');app.innerHTML=`<section class="pov-ending" style="background-image:url('assets/pov-study.webp'),url('assets/pov-study-preview.webp')"><div class="pov-final-scroll"><img src="assets/buddha.webp" alt="呈在你眼前的无量寿尊佛"><div><span class="seal">御前阅览 · 收卷</span><h1>朕览其形<br>亦思其来处</h1><p>营建是朕的裁示，图样由宫中传递，<br>成缂则凝结着画师与织工的劳动。<br>信仰、秩序与技艺，在《缂丝无量寿尊佛》中相遇。</p><a class="primary guided" href="../index.html?level=3&amp;enter=1" onclick="return enterThirdChapter(event)" style="display:inline-block;text-decoration:none">进入“叁 承业之路”</a> <button class="secondary" onclick="home()">再入御案 →</button></div></div></section>`}
function openGame(){prepareGameFrame(chapter);clearInterval(povTimer);mode='game';document.body.classList.add('playing');const c=chapters[chapter];app.innerHTML=`<section class="desk-session desk-session-${chapter}" style="background-image:url('assets/pov-study.webp'),url('assets/pov-study-preview.webp')"><div class="desk-session-shade"></div><div class="presented-case" aria-busy="true"></div>${chapter===3?`<label class="puzzle-size-tools">画面大小<input aria-label="调整整个拼图游戏画面大小"type="range"min="0.8"max="1.4"step="0.05"value="${puzzleZoom}"oninput="resizePuzzle(this.value)"><output id="puzzleScaleValue">100%</output></label>`:''}<p id="reviewHint" class="intent button-hint hidden" aria-live="polite"></p><button class="primary approve-model guided" onclick="finishExperience()">${['准此式样','准此陈设','局部已核','全幅已阅'][chapter]}</button></section>`;if(chapter===3)resizePuzzle(puzzleZoom);else placeGameFrame();if(chapter===0)updateColorContinue();window.scrollTo(0,0)}
home();window.addEventListener('message',e=>{const f=document.querySelector('#miniGame');if(e.origin===location.origin&&f&&e.source===f.contentWindow&&chapter===3&&mode==='game'&&e.data?.type==='kesi-puzzle-return')finishExperience()});function updateColorContinue(){document.querySelector('#reviewHint')?.classList.add('hidden');document.querySelector('.approve-model')?.classList.toggle('color-finished',colorProgress.done===colorProgress.total)}
window.addEventListener('message',e=>{const f=gameFrames.get(0);if(e.origin!==location.origin||e.source!==f?.contentWindow||e.data?.type!=='kesi-color-progress')return;colorProgress={done:e.data.done,total:e.data.total};if(chapter===0&&mode==='game')updateColorContinue()});function setActionHint(selector,text){const hint=document.querySelector('#intent')||document.querySelector('#reviewHint');if(!hint)return;hint.className='intent button-hint';hint.dataset.anchor=selector;hint.textContent=text;positionActionHint();requestAnimationFrame(positionActionHint)}
function positionActionHint(){const hint=document.querySelector('.button-hint:not(.hidden)');if(!hint)return;const anchor=document.querySelector(hint.dataset.anchor||'.approve-model');if(!anchor)return;const r=anchor.getBoundingClientRect();hint.style.maxWidth=Math.min(250,innerWidth-32)+'px';const w=hint.offsetWidth,h=hint.offsetHeight;let x=r.right+12,y=r.top+(r.height-h)/2;if(x+w>innerWidth-16){x=r.left+(r.width-w)/2;y=r.bottom+9;if(y+h>innerHeight-12)y=r.top-h-9}hint.style.left=Math.max(16,Math.min(innerWidth-w-16,x))+'px';hint.style.top=Math.max(8,Math.min(innerHeight-h-8,y))+'px'}</script><style>@media(max-width:700px){html,body{height:100%;overflow:auto}.desk-session{height:100dvh!important;min-height:0!important}.presented-case,.desk-session-1 .presented-case{top:2%!important;left:3%!important;width:94%!important;height:82%!important;max-height:none!important}.approve-model,.desk-session-3 .approve-model{position:absolute;bottom:2%!important;max-width:92%;min-height:36px;padding:8px 18px;font-size:13px}.desk-session-3 .presented-case{top:45%!important;left:50%!important;width:94%!important;height:74%!important;transform:translate(-50%,-50%)!important}.pov-home,.pov-scene,.pov-ending{height:100dvh!important;min-height:0!important}.pov-title{top:16%!important}.pov-title h1{font-size:46px!important}.pov-title p{font-size:14px!important}.pov-document{max-height:90%;overflow:auto}.pov-note{font-size:9px}.puzzle-size-tools{top:0!important;max-width:96%;font-size:10px;gap:4px}.puzzle-size-tools input{width:90px}}.presented-case[aria-busy=true]::after{content:"正在展开画面…";position:absolute;inset:auto 0 8px;text-align:center;color:inherit;pointer-events:none;}</style></html>
