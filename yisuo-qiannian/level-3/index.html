sed':''}"></span>`).join('')}</div>`;$('map').className='map '+['spring','summer','autumn','winter'][seas];let pos=[[14,32],[47,23],[81,36],[32,72],[71,76]];$('map').innerHTML=`<div class="river"></div><svg class="routes" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M14 32 L47 23 L81 36 L71 76 L32 72 L14 32 M47 23 L32 72" fill="none" stroke="#9a8559" stroke-width=".5" stroke-dasharray="2 1"/></svg><div class="season">${['春 · 新绿','夏 · 浓荫','秋 · 金叶','冬 · 素雪'][seas]}</div>`+c.nodes.map((n,i)=>`<button class="node ${s.visited.includes(i)?'visited':''}" style="left:${pos[i][0]}%;top:${pos[i][1]}%;${s.loc===i?'outline:2px solid #5b6a4c':''}" onclick="go(${i})">${n}</button>`).join('');$('log').innerHTML=s.log.map(t=>`<p>${t}</p>`).join('')||'<p>你的行程，将从这里写起。</p>';renderTask();save()}

// Draw one non-interactive outline around the current set of choices.
function kesiGuideChoices(root, choices){
  root.querySelector?.('.kesi-guide-group')?.remove();
  if(!choices.length)return;
  const frame=root.ownerDocument.createElement('span');
  frame.className='kesi-guide-group';
  frame.setAttribute('aria-hidden','true');
  frame.positionForChoices=()=>{
    const area=root.getBoundingClientRect();
    if(!area.width||!area.height)return;
    const boxes=choices.map(choice=>choice.getBoundingClientRect());
    const scaleX=root.offsetWidth/area.width,scaleY=root.offsetHeight/area.height;
    const left=(Math.min(...boxes.map(box=>box.left))-area.left)*scaleX;
    const top=(Math.min(...boxes.map(box=>box.top))-area.top)*scaleY;
    const right=(Math.max(...boxes.map(box=>box.right))-area.left)*scaleX;
    const bottom=(Math.max(...boxes.map(box=>box.bottom))-area.top)*scaleY;
    Object.assign(frame.style,{left:left-5+'px',top:top-5+'px',width:right-left+10+'px',height:bottom-top+10+'px'});
  };
  root.append(frame);
  frame.positionForChoices();
}
globalThis.addEventListener?.('resize',()=>document.querySelectorAll('.kesi-guide-group').forEach(frame=>frame.positionForChoices()));

function qselect(v){q.selected=v;qsave();qrender()}function qdrop(i,event){event?.preventDefault();event?.stopPropagation();if(!q.accepted)return;q.selected=qdrag||q.selected;qdrag=null;if(q.selected==='material'){qgive(i);return}if(!q.selected?.startsWith('task:'))return;let t=q.tasks[+q.selected.split(':')[1]];if(t.p>=100){qtoast('已下机任务请到收验处处理。');return}if(t.worker===i){q.selected=null;qrender();return}if(t.p>0){t.p=Math.max(0,t.p-20);qlog(t.name+'改派织户，交接使进度回退20%。')}t.worker=i;q.selected=null;qlog(t.name+(i<0?'放回待分任务。':'交给'+qworkers[i].name+'。'));qrender()}

function qsample(){if(q.sample||!q.accepted||!qspend(8))return;q.sample=true;qlog('画稿已确认：难纹与色彩参照送至三家织户。');qtick(2);qrender()}
function qeffort(t){return [0,2,3,4][t.hard]}function qguide(i){if(q.guided[i])return;if(!qspend(4))return;q.guided[i]=true;qlog('亲访'+qworkers[i].name+'，核对纹样并指导。该织户后续成品偏差减少。');qtick(1);qrender()}
function qtick(n){for(let z=0;z<n;z++){q.day++;for(let i=0;i<3;i++){if(q.day<q.start[i]||q.hold[i]===q.day)continue;let active=q.tasks.filter(t=>t.worker===i&&t.p<100&&!t.collected);for(let t of active){if(t.p===0&&q.material[i]>0){q.material[i]--;t.p=.01;t.begun=true}}active=active.filter(t=>t.begun);if(!active.length)continue;let capacity=qworkers[i].speed/active.length;for(let t of active){t.p=Math.min(100,t.p+capacity/qeffort(t)*100);if(t.p>=100){t.quality=Math.min(100,qworkers[i].quality+(q.sample?9:0)+(q.guided[i]?10:0)-(t.hard===3?10:0)-(q.sample?0:8)+(q.detail?3:0));qlog(qworkers[i].name+'的'+t.name+'已下机。')}}}for(let i=0;i<3;i++)if(q.day===q.pickup[i])qlog('到'+qworkers[i].name+'处的约定收货日：'+q.tasks.filter(t=>t.worker===i&&t.p>=100&&!t.collected).length+'份已下机。');}qsave()}
function qadvance(){if(!q.accepted){qtoast('先接下差单，再开始承造。');return}if(q.delivered)return;qtick(1);if(q.day>=5&&!q.sample&&!q.colorEvent&&q.tasks.some(t=>t.p>0&&t.p<100)){q.colorEvent=true;qrender();qmodal('中途事件 · 色彩参照不一致','<p>画师发现部分织户对花瓣色彩的理解不一致。如果继续承织，后续可能需要更多修整。</p><div class="qactions">'+btn('送去统一参照 · 6钱',"qresolveColor(true)")+btn('先保进度，收货时处理',"qresolveColor(false)")+'</div>');return}if(q.day>=7&&!q.delay){let loads=qworkers.map((_,i)=>q.tasks.filter(t=>t.worker===i&&t.p<100).length);let i=loads.indexOf(Math.max(...loads));if(loads[i]){q.delay=true;q.hold[i]=q.day+1;qrender();qmodal('中途事件 · 一户织工临时停工',`<p>${qworkers[i].name}因家事明日需暂停一天。${loads[i]>=5?'你把较多任务集中在这一户，交期可能受到更明显影响。':'分散承织的其他织户仍可继续。'}</p><div class="qactions">${btn('支付协助费用 · 5钱',`qhelpDelay(${i})`)}${btn('回任务篮自行改派',"qclose();q.tab=1;qrender()")}${btn('留在原户，等待恢复',"qclose();qrender()")}</div>`);return}}qlog('一日过去。织户按任务量、材料与开工安排推进。');qrender()}
function qresolveColor(pay){if(pay&&q.coins<6){qclose();qtoast('经费不足，需在收货时处理。');return}if(pay){q.coins-=6;q.sample=true;qlog('统一参照已送达，后续制作得到校正。')}else qlog('决定先保进度，收货时再检查色彩偏差。');qclose();qrender()}
function qhelpDelay(i){if(!qspend(5)){qclose();return}q.hold[i]=0;qlog('安排人手协助家事，该户得以照常织造。');qclose();qrender()}
function qschedule(day,event){event?.preventDefault();event?.stopPropagation();let v=qdrag||q.selected;qdrag=null;if(!v?.startsWith('schedule:'))return;let [,type,idx]=v.split(':');idx=+idx;if(day<q.day){qtoast('不能把新安排移到已过去的日期。');return}if(type==='start'&&q.tasks.some(t=>t.worker===idx&&t.p>0)){qtoast('该户已开织，开工记录保留。收货日期仍可调整。');return}if(type==='pickup'&&day<q.start[idx]){qtoast('收货日应在开工日之后。');return}q[type][idx]=day;q.selected=null;qlog(qworkers[idx].name+'的'+(type==='start'?'开工':'收货')+'安排至第'+day+'日。');qrender()}
function qcollect(i){let ts=q.tasks.filter(t=>t.worker===i&&t.p>=100&&!t.collected);if(!ts.length)return;ts.forEach(t=>t.collected=true);q.log.unshift('第'+q.day+'日 · 收回'+qworkers[i].name+'的'+ts.length+'份成品。');q.tab=2;qrender()}
function qinspect(id){let t=q.tasks[id];if(!t.collected)return;if(!q.checked.includes(id))q.checked.push(id);let bad=t.quality<78&&!q.repaired.includes(id);qmodal(t.name+' · 展开查验',`<div style="height:100px;background:repeating-linear-gradient(0deg,transparent 0 3px,#9b793c55 3px 4px),repeating-linear-gradient(90deg,#e1c889 0 2px,#f2e1b5 2px 4px);display:grid;place-items:center;font:38px serif;color:#88593b">${t.hard===3?'❀':'❧'}${bad?' <span style="color:#b84b35">╳</span>':''}</div><p>${bad?'查见局部'+(t.hard===3?'边界转折':'色彩参照')+'偏差。可以安排修整，也可接受当前状态，承担交付质量的影响。':'经展开核对，织面符合本次任务要求。'}</p><div class="qactions">${bad?btn('安排修整 · 1日 / 4钱',`qrepair(${id})`):''}${btn('记录结果，返回',"qclose();qrender()")}</div>`);qsave()}
function qrepair(id){if(!qspend(4)){qclose();return}q.tasks[id].quality=Math.max(85,q.tasks[id].quality);q.repaired.push(id);qlog(q.tasks[id].name+'已修整复查。');qtick(1);qclose();qrender()}
function qdeliver(){if(qcollected()<10)return;let missing=10-q.checked.length;qmodal('差船在候 · 决定交付方式',`<p>已收齐十份成品；${missing?'仍有'+missing+'份尚未查验。':'十份均已展开查验。'}成品综合状态 ${qquality()} / 100。</p><p>差船第16日启程。当前第${q.day}日。${q.day>16?'已错过约定船期，需要另行安排交割。':'可以交割，也可以留在岸上继续检查和修整。'}</p><div class="qactions">${btn('包装交割',"qfinish(false)")}${btn('随船复查 · 6钱',"qfinish(true)",q.coins<6)}${btn('返回继续安排',"qclose()")}</div>`)}
function qfinish(boat){if(boat){q.coins-=6;q.tasks.forEach(t=>{if(t.quality<85)t.quality+=6});qlog('随船复查，处理可在途中修整的小瑕疵。')}q.delivered=true;let quality=qquality(),punctual=q.day<=16,score=Math.max(0,Math.round(quality*.7+(punctual?20:Math.max(0,20-(q.day-16)*4))+(q.checked.length===10?10:0)));qlog('差货完成交割。');qclose();qrender();qmodal('差货入京 · 此程已成',`<h3>${score>=85?'承造有序，交付稳妥':score>=65?'交付完成，积累经验':'曲折交付，尚待精进'}</h3><p>综合结果 <b>${score}</b>/100　·　第${q.day}日交付　·　${punctual?'赶上船期':'错过原定船期'}</p><div class="hint">${q.sample?'画稿让多家织户有统一参照。':'省下了画稿时间，但增加了品质协调的压力。'} ${Math.max(...qworkers.map((_,i)=>q.tasks.filter(t=>t.worker===i).length))>=7?'任务集中，个别织户的进度决定整批交付。':'多户协作使制作并行，也需要更多材料与收验协调。'}</div><p>你完成了接洽、分工、发料、收货、查验与交割。包口的技艺与责任，贯穿这些人和物的往来。</p><div class="qactions">${btn('进入第二关 · 远渡东瀛',"qclose();switchCh(1)")}${btn('回看承造地图',"qclose()")}${btn('换一种分工重玩',"qclose();qreset()")}</div>`);qsave()}
function qmodal(title,content){const d=$('qmodal');d.innerHTML='<small>缂丝经纬 · 差货入京</small><h2>'+title+'</h2>'+content;if(!d.open)d.showModal()}function qclose(){$('qmodal').close()}function qjournal(){qmodal('行事簿 · 众手承业',q.log.map(t=>'<p style="font-size:13px;border-bottom:1px solid #ddd2b7">'+t+'</p>').join('')+btn('返回',"qclose()"))}function qreset(){if(confirm('重新体验第一关？本关分工与进度将清空。')){q=qfresh();qrender()}}document.addEventListener('keydown',e=>{if(s.ch!==0||$('qmodal').open)return;if(e.key==='ArrowRight')qnav((q.loc+1)%6);if(e.key==='ArrowLeft')qnav((q.loc+5)%6)});render();

let qpointer=null,qghost=null,qsuppress=false;
document.addEventListener('pointerdown',e=>{if(s.ch!==0)return;let item=e.target.closest('[data-qdrag]');if(!item)return;qpointer={value:item.dataset.qdrag,x:e.clientX,y:e.clientY,text:item.textContent,moved:false};});

function exportFresh(){return{version:1,scene:'map',day:0,foil:4,trust:70,brief:[],research:false,accepted:false,trial:{materials:[],mode:null,until:0,good:false,score:0,attempts:0},design:{aligned:false,kind:null},jobs:[0,1,2].map(()=>({loom:null,p:0,done:false,reviewed:false,weighed:false,onTable:false,unroll:0,found:false,remedied:false,redo:false,grade:null,waived:false,packed:false})),event:{seen:false,resolved:false,choice:null},inspectIndex:0,selected:null,pane:null,menu:false,shipped:false,journal:[],lastTick:Date.now()}}
let ex;try{ex=JSON.parse(localStorage.getItem(EX_KEY))}catch{}if(!ex||ex.version!==1||ex.jobs?.length!==3)ex=exportFresh();
function exportSave(){localStorage.setItem(EX_KEY,JSON.stringify(ex))}
function exportRecord(key,text){if(!ex.journal.some(x=>x.key===key))ex.journal.unshift({key,text,day:ex.day});exportSave()}
function exportToast(text){let old=document.querySelector('.ex-toast');old?.remove();let n=document.createElement('div');n.className='ex-toast';n.setAttribute('role','status');n.textContent=text;document.querySelector('.ex-world')?.append(n);setTimeout(()=>n.remove(),2600)}
function exportNext(){return!ex.accepted?'office':!ex.trial.good?'trial':!ex.design.kind?'design':!ex.jobs.every(j=>j.done||j.waived)?'factory':'inspect'}
function exportReady(){return ex.jobs.every(j=>j.grade||j.waived)&&ex.jobs.some(j=>j.grade)}
function exportVisit(scene){if(s.ch!==1)return;ex.scene=scene;ex.selected=null;ex.pane=null;exportSave();exportRender()}
function exportTap(action){if(exDrag?.moved||Date.now()<exSuppress)return;if(action.startsWith('open:')){exportVisit(action.split(':')[1]);return}ex.selected=ex.selected===action?null:action;exportSave();exportRender()}
function exportDrop(zone){if(ex.selected)exportApply(ex.selected,zone)}
function exportApply(action,zone){if(s.ch!==1||ex.shipped)return false;let [kind,value]=action.split(':'),changed=false;
 if(kind==='route'&&zone==='route:'+value&&exportCanVisit(value)){ex.scene=value;changed=true;exportRecord('route-'+value,'将'+exportRouteLabel(value)+'送至'+({trial:'试制室',design:'驻厂设计室',factory:'生产车间',inspect:'检验科'}[value]||'公司')+'。')}
 if(kind==='req'&&zone==='brief'&&!ex.brief.includes(value)){ex.brief.push(value);changed=true;exportRecord('brief-'+value,'将'+({pattern:'画稿要求',foil:'来样箔料',accept:'验收约定'}[value])+'收入订单夹。')}
 if(kind==='mat'&&zone==='tray'&&ex.accepted&&!ex.trial.good&&!ex.trial.until&&!ex.trial.materials.includes(value)){ex.trial.materials.push(value);changed=true}
 if(kind==='trial'&&zone==='trial'&&ex.accepted&&ex.trial.materials.length===2&&!ex.trial.until&&!ex.trial.good){let cost=value==='compare'?2:1;if(ex.foil<cost){exportToast('箔料不足，可向公司调取一份来料。');return false}ex.foil-=cost;ex.trial.mode=value;ex.trial.until=Date.now()+4000;ex.trial.attempts++;ex.day+=value==='compare'?3:2;changed=true;exportRecord('trial-'+ex.trial.attempts,(value==='compare'?'安排对照试制，两份样片比较箔料表现。':'安排节料试制，先用一份来料摸清做法。'))}
 if(kind==='draft'&&zone==='draft'&&ex.trial.good&&!ex.design.aligned){ex.design.aligned=true;changed=true;exportRecord('draft','画稿已对准定位标记，工匠与驻厂设计师共同核看。')}
 if(kind==='design'&&zone==='approval'&&ex.design.aligned&&!ex.design.kind){ex.design.kind=value;ex.day+=value==='full'?4:2;ex.trust+=value==='full'?5:8;changed=true;exportRecord('design',value==='full'?'整幅重排，统一新的构图比例；投入更多前期时间。':'局部核稿，确认修改边界，保留其余已定部分。')}
 if(kind==='job'&&zone.startsWith('loom:')&&ex.design.kind){let j=ex.jobs[+value];if(j&&j.loom===null&&!j.waived){j.loom=+zone.split(':')[1];changed=true;exportRecord('job-'+value,'把'+EX_BELTS[+value].name+'安排到'+(j.loom+1)+'号机台。')}}
 if(kind==='review'&&zone==='production'&&ex.jobs.some(j=>j.p>=.25&&!j.done)&&!ex.jobs.every(j=>j.reviewed)){ex.jobs.forEach(j=>j.reviewed=true);ex.day++;ex.trust+=4;changed=true;exportRecord('review','工匠、设计师与检验人员中途复核，及时调整用料与纹样。')}
 if(kind==='belt'&&zone==='scale'){let j=ex.jobs[+value];if(j?.done&&!j.waived){ex.inspectIndex=+value;j.weighed=true;j.onTable=false;j.unroll=0;changed=true;exportRecord('weigh-'+value,EX_BELTS[+value].name+'称重记录：'+exportWeight(+value)+'克。')}}
 if(kind==='cloth'&&zone==='inspection-table'){const i=+value,j=ex.jobs[i];if(i===ex.inspectIndex&&j?.done&&j.weighed&&!j.waived&&!j.onTable){j.onTable=true;changed=true}}
 if(kind==='grade'&&zone==='grade'){changed=exportGrade(+value)}
 if(kind==='pack'&&zone==='case'){let j=ex.jobs[+value];if(j?.grade&&!j.packed){j.packed=true;changed=true}}
 if(kind==='receipt'&&zone==='dispatch'&&ex.jobs.every(j=>j.waived||j.packed)){ex.shipped=true;ex.day++;changed=true;ex.scene='end';ex.pane=null;exportRecord('delivery','核对分级、数量与交货单后完成外销交接。');let score=Math.round(Math.max(20,100-ex.jobs.filter(j=>j.waived).length*20-ex.jobs.filter(j=>j.grade===2).length*7-Math.max(0,ex.day-18)*2));s.complete[1]=score;save()}
 if(changed){ex.selected=null;exportSave();exportRender();return true}return false}
function exportAccept(){if(ex.brief.length!==3||ex.accepted)return;ex.accepted=true;ex.day++;exportRecord('accepted','我作为缂丝工匠负责人，核领箔料和试制要求，开始承接外销任务。');exportVisit('map')}
function exportResearch(){if(ex.research)return;ex.research=true;ex.day+=2;ex.trust+=7;exportRecord('research','随公司赴日调研、展演，记录腰带用途与客户对箔料效果的要求。');ex.pane='research';exportRender()}
function exportMoreFoil(){ex.foil++;ex.day++;exportRecord('foil-'+ex.foil+'-'+ex.day,'公司补发一份日方来料，试制可继续。');exportRender()}
function exportRetry(){if(ex.trial.good||ex.trial.until)return;ex.trial.materials=[];ex.trial.mode=null;exportRender()}
function exportWeight(i){let j=ex.jobs[i];return (i===0?184:i===1?182:177)+(ex.trial.mode==='compare'?4:0)+(j.reviewed?3:0)+(j.redo?8:0)}
function exportDefect(i){return i===1&&!ex.jobs[i].remedied&&!ex.jobs[i].reviewed}
function exportGrade(grade){let i=ex.inspectIndex,j=ex.jobs[i];if(j.grade||j.waived)return false;if(!j.weighed||j.unroll<100){exportToast('先完成称重，再把整条腰带完全展开。');return false}if(exportWeight(i)<180){exportToast('检验员：未达本次订单重量，须重制或由公司协商减量。');return false}if(exportDefect(i)&&grade===1){j.found=true;exportSave();exportToast('局部松浮仍在，需整理后复检；也可按二级协商交付。');exportRender();return false}j.grade=grade;ex.day++;exportRecord('grade-'+i,EX_BELTS[i].name+'评为'+(grade===1?'一级':'二级')+'，分级记录随货交付。');return true}
function exportInspect(i){ex.inspectIndex=i;ex.selected=null;exportRender()}
function exportUnroll(v,commit=false){const j=ex.jobs[ex.inspectIndex];if(!j.weighed||!j.onTable||j.waived||j.grade)return false;j.unroll=Math.max(0,Math.min(100,+v));document.querySelector('.ex49-inspection-plane')?.style.setProperty('--reveal',Math.max(.04,j.unroll/100));const grip=document.querySelector('.ex49-pull-grip');if(grip)grip.setAttribute('aria-valuenow',String(Math.round(j.unroll)));const range=document.querySelector('.ex49-unroll-range');if(range)range.value=j.unroll;const defect=document.querySelector('.ex-defect');if(defect)defect.hidden=j.unroll<100||!exportDefect(ex.inspectIndex);exportSave();if(commit)exportRender();return true}
function exportFind(){let j=ex.jobs[ex.inspectIndex];if(j.unroll<75)return;j.found=true;exportSave();exportRender()}
function exportRemedy(type){let i=ex.inspectIndex,j=ex.jobs[i];if(!j.done||j.grade||j.waived)return;if(type==='polish'&&exportDefect(i)){j.remedied=true;j.found=false;j.weighed=false;j.onTable=false;j.unroll=0;ex.day++;exportRecord('polish-'+i,'将局部松浮交回整理，整理后重新称重、展开复检。');exportRender();return}if(type==='reweave'&&exportWeight(i)<180){j.redo=true;j.done=false;j.p=0;j.weighed=false;j.onTable=false;j.unroll=0;ex.day+=3;exportRecord('redo-'+i,'重量未达订单要求，安排重制；不以填料改变称重结果。');exportVisit('factory')}if(type==='waive'&&exportWeight(i)<180){j.waived=true;ex.day++;ex.trust=Math.max(0,ex.trust-12);exportRecord('waive-'+i,'公司与客户确认减量交付，未达标腰带不装运，交付价值相应减少。');exportRender()}}
function exportEvent(choice){if(!ex.event.seen||ex.event.resolved)return;ex.event.resolved=true;ex.event.choice=choice;ex.day+=choice==='restart'?3:1;ex.trust+=choice==='restart'?6:3;if(choice==='restart')ex.jobs.forEach(j=>{if(!j.done&&j.loom!==null)j.p=Math.max(0,j.p-.25)});exportRecord('change',choice==='restart'?'驻厂设计师提出调整，工匠停机重排，已织进度退回一部分。':'以局部画稿沟通调整，仅修改边界区域，保留已织部分。');exportRender()}
function exportTick(){let now=Date.now(),dt=Math.min(1200,Math.max(0,now-ex.lastTick));ex.lastTick=now;if(s.ch!==1)return;let changed=false;if(ex.trial.until&&now>=ex.trial.until){ex.trial.until=0;ex.trial.score=ex.trial.mode==='compare'?86:ex.research||ex.trial.attempts>1?78:64;ex.trial.good=ex.trial.score>=70;changed=true;exportRecord('trial-result-'+ex.trial.attempts,ex.trial.good?'样片达到本次要求，可移交驻厂设计团队。':'节料样片出现箔面不匀，需要重新配料、调整做法。')}
 if(!ex.event.seen&&ex.jobs.some(j=>j.p>=.4)){ex.event.seen=true;changed=true;exportRecord('change-request','驻厂设计师到机旁提出局部调整，制作暂缓，等待我协调。')}
 if(!ex.event.seen||ex.event.resolved){for(let loom=0;loom<2;loom++){let i=ex.jobs.findIndex(j=>j.loom===loom&&!j.done&&!j.waived);if(i<0)continue;let j=ex.jobs[i];j.p=Math.min(1,j.p+dt/(j.redo?6500:loom===0?13500:11000));if(j.p>=1){j.done=true;changed=true;exportRecord('offloom-'+i+'-'+j.redo,EX_BELTS[i].name+'已下机，等待检验。')}}}
 document.querySelectorAll('[data-ex-progress]').forEach(n=>{let i=+n.dataset.exProgress;n.style.setProperty('--progress',ex.jobs[i].p);n.querySelector('small').textContent=Math.round(ex.jobs[i].p*100)+'%'});let trial=document.querySelector('.ex-trial-growing');if(trial)trial.style.setProperty('--progress',String(1-Math.max(0,ex.trial.until-now)/4000));exportSave();if(changed)exportRender()}
setInterval(exportTick,350);
function exportFlower(x,y,c='#e9ddbd',size=1){return `<g transform="translate(${x} ${y}) scale(${size})">${Array.from({length:9},(_,n)=>`<ellipse cx="0" cy="-9" rx="3.2" ry="8" transform="rotate(${n*40})" fill="${c}" stroke="#6b6b5c" stroke-width=".35"/>`).join('')}<circle r="3.2" fill="#bfa477"/></g>`}
const EX_PRODUCT_FILES=[{file:'product-silver-flat39.lite.webp',w:828,h:1899},{file:'product-floral38.lite.webp',w:530,h:2047},{file:'product-roundels38.lite.webp',w:498,h:2047}];
function exportBelt(i,defect=false){const t=EX_PRODUCT_FILES[i];return `<svg viewBox="0 0 800 140" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${EX_BELTS[i].name}实物织面"><svg width="800" height="140" viewBox="0 0 ${t.h} ${t.w}" preserveAspectRatio="none"><image href="export-era/${t.file}" width="${t.w}" height="${t.h}" transform="translate(${t.h} 0) rotate(90)"/></svg>${defect?'<g fill="none" stroke="#d7c5a8" stroke-width="1.4"><path d="M495 78q12-16 26-3t24-3M495 82q12-16 26-3t24-3M495 86q12-16 26-3t24-3"/></g>':''}</svg>`}

function exportDragButton(action,label,art='',classes=''){return `<button class="ex-object ${classes} ${ex.selected===action?'is-selected':''}" data-ex-drag="${action}" onclick="exportTap('${action}')">${art}<b>${label}</b></button>`}
function exportDropBox(zone,label,extra=''){return `<button class="ex-drop ${extra}" data-ex-drop="${zone}" onclick="exportDrop('${zone}')">${label}</button>`}
function exportHeader(){let h={map:['外销协作图','公司接洽与来料核领，衔接厂内试制、设计、承织和检验'],office:['我是缂丝工匠负责人','公司召集试制，我来核领日方箔料与要求'],trial:['先试织一片，看看箔面效果','放好材料，再点安排试织'],design:['我与驻厂设计师对稿','对齐画稿，确认本次修改范围'],factory:['我来排单，织工开织','可以继续派单，也可中途复核'],inspect:['下机以后，逐条验收','先称重，再完全展开，最后分级'],end:['订单有了交接回执','试制、沟通与检验，留下这次交付的结果']}[ex.scene];return `<div class="ex-brand">缂丝经纬<small>第二关 · 远渡东瀛</small></div><header class="ex-heading"><small>上世纪七八十年代 · 外销协作</small><h2>${h[0]}</h2><p>${h[1]}</p></header><nav class="ex-tools"><button onclick="full()">全屏</button><button aria-label="第二关菜单" onclick="ex.menu=!ex.menu;exportRender()">⋯</button></nav><div class="ex-order-strip">第${ex.day+1}日 · 箔料余${ex.foil}份</div>`}
function exportCanVisit(scene){return scene==='office'||scene==='map'||(scene==='trial'?ex.accepted:scene==='design'?ex.trial.good:scene==='factory'?!!ex.design.kind:scene==='inspect'?ex.jobs.every(j=>j.done||j.waived):false)}
function exportHandoff(scene){exportVisit('map')}
function exportRouteLabel(next){return {trial:'试制要求与来样箔料',design:'通过的试织样片',factory:'确认后的画稿',inspect:'下机待验的腰带'}[next]||'订单资料'}
function exportMap(){const nodes=[['office','进出口公司',10,25],['trial','试制室',57,37],['design','驻厂设计室',85,37],['factory','生产车间',48,62],['inspect','检验科',84,62]],next=exportNext();return `<svg class="ex45-route-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M10 25C25 25 40 37 57 37L85 37Q90 50 70 51T48 62L84 62"/></svg>${nodes.map(([key,name,x,y])=>`<button class="ex-map-node ${key==='office'?'ex-company-node':'ex-department-node'} ${next===key?'ex-next ex-guide-cue':''} ${!exportCanVisit(key)?'ex45-locked':''}" style="left:${x}%;top:${y}%" ${!exportCanVisit(key)?'disabled':''} data-ex-drop="route:${key}" onclick="exportVisit('${key}')">${name}<small>${key===next?(key==='office'?'从这里接洽订单':'进入部门'):key==='office'?'订单已核领':key==='trial'?(ex.trial.good?'试制已通过':'等待公司来料'):key==='design'?(ex.design.kind?'':'待试制通过'):key==='factory'?ex.jobs.filter(j=>j.done).length+'/3 下机':'称重 · 展开 · 分级'}</small></button>`).join('')}<div class="ex-map-note">${!ex.accepted?'先到进出口公司核领订单与来料':'订单与实物随流程在部门间交接'}</div>`}

function exportOffice(){let names={pattern:'画稿与用途',foil:'日方来样箔料',accept:'称重与分级约定'};return `<div class="ex-brief-items">${Object.keys(names).map(k=>ex.brief.includes(k)?`<span class="ex-filed-item">${names[k]} · 已核对</span>`:exportDragButton('req:'+k,names[k],k==='foil'?'<img class="ex-foil-reference" src="export-era/foil-material39.lite.webp" alt="黑金色日方来样箔料" draggable="false">':'<span class="ex-paper-lines"></span>')).join('')}</div>${exportDropBox('brief',`<b>外销订单夹</b><span>${ex.brief.length}/3 项已核对</span><small>拖入资料，也可点选后收入</small>`,'ex-order-folder')}${ex.brief.length===3?`<button class="ex-office-trial-next ex-next" onclick="${ex.accepted?"exportVisit('trial')":"exportAccept()"}">带着要求去试织 →</button>`:''}`}

function exportSilkSkeins(){return `<span class="ex40-silk-group" aria-hidden="true">${['#e5dbc4','#9ca9a0','#394959'].map(c=>`<i class="ex40-silk" style="--silk-color:${c}"></i>`).join('')}</span>`}
function exportTrial(){const t=ex.trial;if(!ex.accepted)return '<div class="ex-scene-note">先核领来料与要求。<button class="ex-next" onclick="exportVisit(\'office\')">回公司核领 →</button></div>';
const running=!!t.until,failed=t.attempts>0&&!running&&!t.good,ready=t.materials.length===2;
return `<div class="ex39-trial-hint">${t.good?'样片已通过，可继续对稿。':running?'正在试织，稍候查看结果。':failed?'':ready?'材料齐了，点下方“安排试织”。':''}</div>
${!running&&!t.good&&!failed?`<div class="ex-materials">${!t.materials.includes('foil')?'<button class="ex-object ex-guide-cue" data-ex-drag="mat:foil" onclick="exportTrialAdd(\'foil\')"><img class="ex-foil-reference" src="export-era/foil-material39.lite.webp" alt="处理后的黑金色箔料" draggable="false"><b>箔料</b></button>':''}${!t.materials.includes('silk')?'<button class="ex-object ex-guide-cue" data-ex-drag="mat:silk" onclick="exportTrialAdd(\'silk\')">'+exportSilkSkeins()+'<b>配套丝线</b></button>':''}</div>${exportDropBox('tray',`<b>试织料盘</b><span>${t.materials.includes('foil')?'<img class="ex-foil-reference" src="export-era/foil-material39.lite.webp" alt="料盘中的箔料" draggable="false">':''}${t.materials.includes('silk')?exportSilkSkeins():''}</span><small class="ex40-tray-instruction">把箔料和丝线分别拖入料盘中</small>`,'ex-trial-tray')}`:''}
${!running&&t.attempts?`<div class="ex-sample-area ${running?'ex-trial-growing':''} ${failed?'ex-uneven':''}" style="--progress:${running?0:1}">${failed?'<img class="ex-trial-failure" src="export-era/trial-failed38.lite.webp" alt="试织失败的箔面" draggable="false">':exportBelt(0)}<span>${running?'机台正在试织…':t.good?'样片通过':'箔面不平'}</span></div>`:''}
<div class="ex39-trial-action">${t.good?'<button class="ex-next ex-guide-cue" onclick="exportHandoff(\'design\')">带样片去对稿 →</button>':running?'<div class="ex39-trial-wait" role="status">正在试织…</div>':failed?'<button class="ex-next ex-guide-cue" onclick="exportSimpleTrial()">箔面不平，调整后重试</button><small class="report-trial-cost">重试用箔料 2 份</small>':ready?'<button class="ex-next ex-guide-cue" onclick="exportSimpleTrial()">安排试织 →</button>':''}</div>`}
function exportTrialAdd(k){if(Date.now()<exSuppress||ex.trial.until||ex.trial.good)return;exportApply('mat:'+k,'tray')}

function m3MediaStep(){
  const v=m3.media;
  if(v.playing)return 'playing';
  if(!v.slots.every(Boolean))return 'choose';
  if(v.previewed===v.slots.join(',')||(v.published&&!v.previewed))return 'publish';
  return 'preview';
}
function m3RecommendMedia(){
  const v=m3.media;
  if(v.playing)return;
  const available=['hands','court','product','voice','trial','codesign'].filter(shot=>!v.slots.includes(shot));
  v.slots=v.slots.map(key=>key||available.shift());
  v.focus=0;
  v.customize=false;
  m3.selected=null;
  m3Render();
}
function m3EditMedia(){
  if(m3.media.playing)return;
  m3.media.customize=true;
  m3.pane=null;
  m3.selected=null;
  m3Render();
}
function m3Media(){
  const v=m3.media,step=m3MediaStep();
  const selectedSlot=m3.selected?.startsWith('slot:')?Number(m3.selected.slice(5)):v.focus;
  const key=v.playing?v.slots[v.playIndex]:v.slots[selectedSlot]||v.slots.find(Boolean)||'hands';
  const shot=M3_SHOTS[key],publishing=step==='publish'&&!v.customize;
  const editing=!v.playing&&!publishing;
  const thumb=key=>`<img class="m3-shot-thumb" data-shot="${key}" src="${M3_SHOTS[key].image}" alt="" draggable="false">`;
  const camera=`<div class="m3-camera ${v.playing?'is-playing':''}">
    <div class="m3-camera-image m3-shot-${key}" style="--m64-shot:url('${new URL(shot.image.replace(/^\//,''),document.baseURI).href}');background-image:var(--m64-shot)">
      ${key==='hands'?'<span class="m66-original-shot" aria-hidden="true"></span>':key==='product'?'<div class="m3-camera-product">'+m3Product()+'</div>':''}</div>
    <small>${v.playing?'播放 '+(v.playIndex+1)+' / 3':'取景预览'}</small><p>${shot.caption}</p>
  </div>`;
  const editor=editing?`<div class="m62-edit-panel">
    <header class="m62-edit-header"><b>可选素材</b><small>点选或拖入镜头格</small>
      ${step==='choose'?'<button class="m58-media-primary" onclick="m3RecommendMedia()">使用推荐镜头</button>':'<button class="m58-media-primary" onclick="m3Play()">播放预览 →</button>'}</header>
    <div class="m3-shot-pool m61-shot-library" aria-label="可选素材">${Object.entries(M3_SHOTS).map(([key,info])=>
      m3Object('clip:'+key,(v.slots.includes(key)?'✓ ':'')+info.name,thumb(key),v.slots.includes(key)?'m52-choice-picked':'')).join('')}</div>
    <div class="m64-timeline-panel"><b>已选镜头</b><div class="m3-timeline" aria-label="已选镜头">${v.slots.map((key,i)=>`<div class="m3-time-slot" data-m3-drop="timeline:${i}" onclick="m3Drop('timeline:${i}')">
      <small aria-label="镜头 ${i+1}">${String(i+1).padStart(2,'0')}</small>${key?m3Object('slot:'+i,M3_SHOTS[key].name,thumb(key)):'<span>拖入画面</span>'}
      ${key?`<span class="m52-slot-controls">${i?`<button onclick="event.stopPropagation();m3Apply('slot:${i}','timeline:${i-1}')" aria-label="向前移动镜头">前移</button>`:''}${i<2?`<button onclick="event.stopPropagation();m3Apply('slot:${i}','timeline:${i+1}')" aria-label="向后移动镜头">后移</button>`:''}</span>`:''}</div>`).join('')}</div></div>
  </div>`:'';
  const publish=publishing?`<div class="m3-channels m62-publish">
    <b>③ 模拟发布</b><small>选择一种传播方式</small>

  return `<div class="m62-media ${editing?'is-editing':'is-reviewing'}">${camera}${editor}${publish}${v.playing?'<p class="m62-play-status" role="status">② 正在播放预览</p>':''}</div>`;
}

        <path d="M-13 0Q-7 -6 0 -4.8Q7 -6 13 0Q7 6 0 4.8Q-7 6 -13 0Z"
          fill="#916740" stroke="#523a27" stroke-width="1"/>
        <path d="M-7 0Q0 -3.5 7 0Q0 3.5 -7 0Z" fill="${palettes[color][2]}" stroke="#604731" stroke-width=".65"/>
      </g>`);

  }).join('');

    aria-label="${warpOnly?'只有纵向贯通的经线':'经线与纬线交替穿插，两侧金色纬线和中央红色纬线各在本色区域折返'}">

        ${thread('M640 130V270M715 130V270','warp',10)}
        <g mask="url(#m55-inset-crossings)">${thread('M592 166H715C762 166 762 232 715 232H592','red',11)}</g>
