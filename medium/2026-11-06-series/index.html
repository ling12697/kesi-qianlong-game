const addon=d.createElement('script');addon.id='seriesPolish';addon.textContent="(()=>{\nconst q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];\nconst clueData={map:{title:'边疆治理线索',text:'四处地点已经连成一条路线，接下来对照两幅佛像原画。'},art:{title:'佛像改样线索',text:'你已从简本与繁本中辨认三处变化，下一步前往大乘阁。'},hall:{title:'殿阁与文物线索',text:'你在殿阁中找到缂丝画卷，三条线索已汇合。'}};\nconst timer={};\nfunction announceClue(key){const item=clueData[key],badge=q('.pip[data-clue=\"'+key+'\"]'),box=q('#seriesClue');if(!item||!box)return;if(badge)badge.classList.add('done');q('#seriesClueTitle').textContent=item.title;q('#seriesClueText').textContent=item.text;box.classList.add('show');clearTimeout(timer[key]);timer[key]=setTimeout(()=>box.classList.remove('show'),3400)}\nconst hero=q('.cover-hero');const originalArt=q('#end img');if(hero&&originalArt){const img=originalArt.cloneNode(false);img.alt='缂丝无量寿尊佛文物原图';hero.appendChild(img)}\nconst mapCount=q('#mapCount');if(mapCount){new MutationObserver(()=>{if(mapCount.textContent.trim()==='4 / 4')announceClue('map')}).observe(mapCount,{childList:true,characterData:true,subtree:true})}\nq('#mapNext')?.addEventListener('click',()=>setTimeout(()=>announceClue('map'),250));\nq('#compareNext')?.addEventListener('click',()=>setTimeout(()=>announceClue('art'),250));\nq('#complete')?.addEventListener('click',()=>setTimeout(()=>announceClue('hall'),250));\n\n// Turn the map into a small investigation: inspect a sealed record, file it, then make a chronology judgment.\nconst mapInfo=[\n {name:'准噶尔',text:'乾隆二十年（1755），清廷平定达瓦齐。请把这条军事治理线索单独记录。宫廷佛像改样记录出现得更早，不能把两件事写成前后因果。'},\n {name:'蒙古',text:'藏传佛教在蒙古地区社会文化中影响深远，清廷重视相关宗教政策。将它作为理解清代宫廷艺术背景的一条线索。'},\n {name:'西藏',text:'藏传佛教宗教文化与清代宫廷艺术存在值得观察的联系。先记录这层文化背景，不直接推断它就是某件作品改样的原因。'},\n {name:'承德 / 北京',text:'承德普宁寺及北京须弥灵境，为观察清代宗教建筑与供奉背景提供线索。把建筑、供奉与作品的关联留待后续关卡继续核对。'}\n];\nconst mapScreen=q('#map'),quiz=q('.quiz'),mapSpots=qa('.mapspot');let archived=new Set(),caseIndex=-1,mapSolved=false;\nq('#map .chapter h1').textContent='奉旨查档 · 追索佛像';q('#map .chapter p').textContent='逐处查阅地域档案，收入任务卷，再判断这些历史线索能否构成因果。';\nconst board=document.createElement('div');board.className='mission-steps';board.innerHTML='<div class=\"mission-step\" data-step=\"files\"><i>1</i><span>查阅地域档案　<span class=\"mission-file-count\">0 / 4</span></span></div><div class=\"mission-step\" data-step=\"judge\"><i>2</i><span>甄别事件先后</span></div><div class=\"mission-step\" data-step=\"continue\"><i>3</i><span>前往佛像原画</span></div><div class=\"mission-meter\"><b></b></div><button class=\"btn tiny mission-review\" id=\"missionReview\" disabled>先查阅四处档案</button>';\nif(quiz)quiz.appendChild(board);\nconst dossier=document.createElement('div');dossier.className='dossier-shade';dossier.id='mapDossier';dossier.setAttribute('role','dialog');dossier.setAttribute('aria-modal','true');dossier.innerHTML='<article class=\"dossier-card\"></article>';\ndocument.body.appendChild(dossier);\nconst caseCardHtml='<div class=\"dossier-kicker\"><span>内廷查访 · 情境任务</span><span id=\"dossierState\">待查阅</span></div><div class=\"dossier-seal\">御</div><h2 id=\"dossierTitle\">地域档案</h2><p id=\"dossierText\">封签尚未拆开。请先查阅档案，再决定是否收入任务卷。</p><div class=\"dossier-actions\"><button class=\"btn alt\" id=\"dossierRead\">拆封查阅</button><button class=\"btn\" id=\"dossierFile\" hidden>收入任务卷</button><button class=\"btn alt\" id=\"dossierClose\">回到舆图</button></div><p class=\"dossier-foot\">情境任务为互动演绎；史实判断以卡片所列资料为准。</p>';\nfunction updateBoard(){const n=archived.size;const count=board.querySelector('.mission-file-count');if(count)count.textContent=n+' / 4';board.querySelector('.mission-meter b').style.width=(n/4*100)+'%';board.querySelector('[data-step=\"files\"]').classList.toggle('done',n===4);board.querySelector('[data-step=\"judge\"]').classList.toggle('done',mapSolved);board.querySelector('[data-step=\"continue\"]').classList.toggle('done',mapSolved);const button=q('#missionReview');button.disabled=n<4;button.textContent=mapSolved?'任务完成 · 前往佛像原画 →':n===4?'整理线索，完成判断 →':'先查阅四处档案'}; \nfunction openCase( ist.remove('show')});\nfunction openJudgment(){dossier.classList.add('show');dossier.querySelector('.dossier-card').innerHTML='<div class=\"dossier-kicker\"><span>任务复核 · 时序判断</span><span>档案 4 / 4</span></div><div class=\"dossier-seal\">验</div><h2 id=\"dossierTitle\">怎样整理这组线索？</h2><p>准噶尔档案记载乾隆二十年（1755）的军事事件；地图线索同时提醒，宫廷佛像改样记录出现得更早。请选择最稳妥的结论。</p><div class=\"judgment-options\"><button class=\"judgment-choice\" data-answer=\"wrong\">A · 军事行动直接促成了这件佛像的改样。</button><button class=\"judgment-choice\" data-answer=\"right\">B · 分别记录治理背景与佛像改样；现有线索不支持把它们说成直接因果。</button></div><p class=\"judgment-result\" id=\"judgmentResult\" aria-live=\"polite\">选择后会显示复核结果；答错可以重新判断。</p><div class=\"dossier-actions\"><button class=\"btn alt\" id=\"judgmentBack\">回地图复核</button><button class=\"btn\" id=\"judgmentContinue\" hidden>任务完成 · 前往佛像原画 →</button></div><p class=\"dossier-foot\">情境任务中的判断以已展示档案为依据，不把不同年份压缩成单一因果。</p>';\nconst result=q('#judgmentResult'),continueBtn=q('#judgmentContinue');dossier.querySelectorAll('.judgment-choice').forEach(choice=>choice.addEventListener('click',()=>{if(choice.dataset.answer==='right'){mapSolved=true;result.textContent='判断通过：保留时间先后与史实边界。四处档案已经整理完成。';result.className='judgment-result ok';continueBtn.hidden=false;q('#mapNext').disabled=false;q('#mapNext').textContent='前往佛像原画 →';board.querySelector('[data-step=\"judge\"]').classList.add('done');updateBoard();if(navigator.vibrate)navigator.vibrate([20,30,20]);burstFrom(choice,18)}else{result.textContent='这项结论把两条线索写成了直接因果。回看准噶尔档案里的时间提醒，再试一次。';result.className='judgment-result retry';choice.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:260})}}));q('#judgmentBack').addEventListener('click',()=>{dossier.classList.remove('show');q('#mapText').textContent='可重新点击已归档地点复核线索，完成后再整理判断。'});continueBtn.addEventListener('click',()=>{dossier.classList.remove('show');q('#mapNext').click()})}\nq('#missionReview')?.addEventListener('click',()=>{if(mapSolved)q('#mapNext').click();else openJudgment()});updateBoard();\n\nconst zoom=q('#detailZoom'), scaleLabel=q('#detailScale');let scale=1.3;const pan=new Map();\nfor(const side of ['left','right']){const source=q('.art-area[data-art=\"'+side+'\"] img'),target=q('#detail'+(side==='left'?'Left':'Right'));if(source&&target)target.src=source.src;pan.set(side,{x:0,y:0,start:null});}\nfunction renderZoom(){if(scaleLabel)scaleLabel.textContent=Math.round(scale*100)+'%';qa('.zoom-pane img').forEach(img=>{const side=img.id==='detailLeft'?'left':'right',p=pan.get(side);img.style.transform='translate('+p.x+'px,'+p.y+'px) scale('+scale+')'})}\nq('#detailsOpen')?.addEventListener('click',()=>{zoom?.classList.add('show');scale=1.3;pan.forEach(p=>{p.x=0;p.y=0});renderZoom()});\nq('#detailClose')?.addEventListener('click',()=>zoom?.classList.remove('show'));\nq('#detailPlus')?.addEventListener('click',()=>{scale=Math.min(2.8,scale+.2);renderZoom()});\nq('#detailMinus')?.addEventListener('click',()=>{scale=Math.max(1,scale-.2);renderZoom()});\nzoom?.addEventListener('click',e=>{if(e.target===zoom)zoom.classList.remove('show')});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')zoom?.classList.remove('show')});\nqa('.zoom-pane').forEach(pane=>{const side=pane.dataset.zoomPane,p=pan.get(side);pane.addEventListener('pointerdown',e=>{p.start={x:e.clientX,y:e.clientY,px:p.x,py:p.y};pane.setPointerCapture(e.pointerId)});pane.addEventListener('pointermove',e=>{if(!p.start)return;p.x=p.start.px+e.clientX-p.start.x;p.y=p.start.py+e.clientY-p.start.y;renderZoom()});pane.addEventListener('pointerup',()=>p.start=null);pane.addEventListener('pointercancel',()=>p.start=null)});\n\nconst frame=q('#modelFrame'),loadState=q('#modelLoadState');let attempts=0;\nfunction checkModel(){if(!frame||!loadState)return;attempts++;let doc;try{doc=frame.contentDocument}catch{}if(doc?.querySelector('#view')){loadState.textContent='模型已载入 · 可拖动旋转';loadState.classList.remove('error');return}if( ll an active search scene.\nconst hall=q('#hall'),hallStage=q('.hall-stage');if(hall&&hallStage){const lantern=document.createElement('div');lantern.className='hall-lantern';lantern.setAttribute('aria-hidden','true');hallStage.appendChild(lantern);const instruction=document.createElement('div');instruction.className='search-instruction';instruction.innerHTML='<b>寻画提示</b><br>移动鼠标或手指，沿殿内画面细看缂丝画卷。';hallStage.appendChild(instruction);let idle=0,moved=false;hall.addEventListener('pointermove',e=>{const r=hall.getBoundingClientRect();hall.style.setProperty('--lantern-x',(e.clientX-r.left)+'px');hall.style.setProperty('--lantern-y',(e.clientY-r.top)+'px');moved=true;hall.classList.remove('searching');clearTimeout(idle);idle=setTimeout(()=>{if(moved){hall.classList.add('searching');setTimeout(()=>hall.classList.remove('searching'),1800)}},4200)});const watch=new MutationObserver(()=>{if(hall.classList.contains('active')){moved=false;clearTimeout(idle);idle=setTimeout(()=>hall.classList.add('searching'),6500)}else hall.classList.remove('searching')});watch.observe(hall,{attributes:true,attributeFilter:['class']});q('#artTarget')?.addEventListener('click',e=>{hall.classList.remove('searching');burstFrom(e.currentTarget,20);if(navigator.vibrate)navigator.vibrate([22,30,22])})}\n})();";d.body.appendChild(addon);
