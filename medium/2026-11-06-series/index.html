const extras=d.createElement('div');extras.innerHTML="<div class=\"series-clue\" id=\"seriesClue\" role=\"status\" aria-live=\"polite\"><div class=\"seal\">御</div><div><b id=\"seriesClueTitle\">线索入卷</b><span id=\"seriesClueText\"></span></div></div><div class=\"detail-zoom\" id=\"detailZoom\" role=\"dialog\" aria-modal=\"true\" aria-label=\"放大查看缂丝原画\"><div class=\"zoom-shell\"><div class=\"zoom-head\"><div><strong>原画细节</strong><small>拖动查看局部，使用加减按钮调整倍率</small></div><div class=\"zoom-buttons\"><button class=\"btn alt\" id=\"detailMinus\" aria-label=\"缩小\">−</button><span id=\"detailScale\">130%</span><button class=\"btn alt\" id=\"detailPlus\" aria-label=\"放大\">＋</button><button class=\"btn\" id=\"detailClose\">收起</button></div></div><div class=\"zoom-grid\"><div class=\"zoom-pane\" data-zoom-pane=\"left\"><label>简本 · 故宫藏</label><img id=\"detailLeft\" alt=\"故宫藏简本缂丝佛像原图细节\"></div><div class=\"zoom-pane\" data-zoom-pane=\"right\"><label>繁本 · 故宫藏</label><img id=\"detailRight\" alt=\"故宫藏繁本缂丝佛像原图细节\"></div></div><p class=\"zoom-note\">原图保持原色与完整比例；放大只用于观察，不改变文物图像</p></div></div>";while(extras.firstChild)d.body.appendChild(extras.firstChild);
const addon=d.createElement('script');addon.id='seriesPolish';addon.textContent="(()=>{\nconst q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];\nconst clueData={map:{title:'边疆治理线索',text:'四处地点已经连成一条路线，接下来对照两幅佛像原画。'},art:{title:'佛像改样线索',text:'你已从简本与繁本中辨认三处变化，下一步前往大乘阁。'},hall:{title:'殿阁与文物线索',text:'你在殿阁中找到缂丝画卷，三条线索已汇合。'}};\nconst timer={};\nfunction announceClue(key){const item=clueData[key],badge=q('.pip[data-clue=\"'+key+'\"]'),box=q('#seriesClue');if(!item||!box)return;if(badge)badge.classList.add('done');q('#seriesClueTitle').textContent=item.title;q('#seriesClueText').textContent=item.text;box.classList.add('show');clearTimeout(timer[key]);timer[key]=setTimeout(()=>box.classList.remove('show'),3400)}\nconst hero=q('.cover-hero');const originalArt=q('#end img');if(hero&&originalArt){const img=originalArt.cloneNode(false);img.alt='缂丝无量寿尊佛文物原图';hero.appendChild(img)}\nconst mapCount=q('#mapCount');if(mapCount){new MutationObserver(()=>{if(mapCount.textContent.trim()==='4 / 4')announceClue('map')}).observe(mapCount,{childList:true,characterData:true,subtree:true})}\nq('#mapNext')?.addEventListener('click',()=>setTimeout(()=>announceClue('map'),250));\nq('#compareNext')?.addEventListener('click',()=>setTimeout(()=>announceClue('art'),250));\nq('#complete')?.addEventListener('click',()=>setTimeout(()=>announceClue('hall'),250));\n\nconst zoom=q('#detailZoom'), scaleLabel=q('#detailScale');let scale=1.3;const pan=new Map();\nfor(const side of ['left','right']){const source=q('.art-area[data-art=\"'+side+'\"] img'),target=q('#detail'+(side==='left'?'Left':'Right'));if(source&&target)target.src=source.src;pan.set(side,{x:0,y:0,start:null});}\nfunction renderZoom(){if(scaleLabel)scaleLabel.textContent=Math.round(scale*100)+'%';qa('.zoom-pane img').forEach(img=>{const side=img.id==='detailLeft'?'left':'right',p=pan.get(side);img.style.transform='translate('+p.x+'px,'+p.y+'px) scale('+scale+')'})}\nq('#detailsOpen')?.addEventListener('click',()=>{zoom?.classList.add('show');scale=1.3;pan.forEach(p=>{p.x=0;p.y=0});renderZoom()});\nq('#detailClose')?.addEventListener('click',()=>zoom?.classList.remove('show'));\nq('#detailPlus')?.addEventListener('click',()=>{scale=Math.min(2.8,scale+.2);renderZoom()});\nq('#detailMinus')?.addEventListener('click',()=>{scale=Math.max(1,scale-.2);renderZoom()});\nzoom?.addEventListener('click',e=>{if(e.target===zoom)zoom.classList.remove('show')});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')zoom?.classList.remove('show')});\nqa('.zoom-pane').forEach(pane=>{const side=pane.dataset.zoomPane,p=pan.get(side);pane.addEventListener('pointerdown',e=>{p.start={x:e.clientX,y:e.clientY,px:p.x,py:p.y};pane.setPointerCapture(e.pointerId)});pane.addEventListener('pointermove',e=>{if(!p.start)return;p.x=p.start.px+e.clientX-p.start.x;p.y=p.start.py+e.clientY-p.start.y;renderZoom()});pane.addEventListener('pointerup',()=>p.start=null);pane.addEventListener('pointercancel',()=>p.start=null)});\n\nconst frame=q('#modelFrame'),loadState=q('#modelLoadState');let attempts=0;\nfunction checkModel(){if(!frame||!loadState)return;attempts++;let doc;try{doc=frame.contentDocument}catch{}if(doc?.querySelector('#view')){loadState.textContent='模型已载入 · 可拖动旋转';loadState.classList.remove('error');return}if(attempts<10){setTimeout(checkModel,450);return}loadState.textContent='建筑模型未能载入完整，请刷新页面后重试。';loadState.classList.add('error')}\nif(frame){frame.addEventListener('load',()=>{attempts=0;setTimeout(checkModel,200)});setTimeout(checkModel,800)}\n\n// Give each discovery a tactile response and invite active inspection.\nfunction burstAt(x,y,count=12){const host=document.createElement('span');host.className='feedback-burst';host.style.left=x+'px';host.style.top=y+'px';for(let i=0;i<count;i++){const dot=document.createElement('i'),a=Math.PI*2*i/count,r=24+Math.random()*24;dot.style.setProperty('--dx',Math.cos(a)*r+'px');dot.style.setProperty('--dy',Math.sin(a)*r+'px');host.appendChild(dot)}document.body.appendChild(host);setTimeout(()=>host.remove(),700)}\nfunction burstFrom(el,n){if(!el)return;const r=el.getBoundingClientRect();burstAt(r.left+r.width/2,r.top+r.height/2,n)}\nqa('.mapspot').forEach(spot=>spot.addEventListener('click',()=>{if(spot.classList.contains('done')){burstFrom(spot,12);if(navigator.vibrate)navigator.vibrate(18)}}));\n\n// A movable lens lets visitors inspect both authentic images before choosing a difference.\nqa('.art-area').forEach(area=>{const img=area.querySelector('img');if(!img)return;const lens=document.createElement('span');lens.className='touch-lens';lens.setAttribute('aria-hidden','true');lens.style.backgroundImage='url(\"'+(img.currentSrc||img.src)+'\")';area.appendChild(lens);const move=e=>{const r=area.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top));lens.style.left=x+'px';lens.style.top=y+'px';lens.style.backgroundSize='280% 280%';lens.style.backgroundPosition=(r.width?x/r.width*100:50)+'% '+(r.height?y/r.height*100:50)+'%';lens.classList.add('show')};area.addEventListener('pointermove',move);area.addEventListener('pointerdown',move);area.addEventListener('pointerleave',()=>lens.classList.remove('show'));area.addEventListener('pointerup',()=>{if(matchMedia('(pointer: coarse)').matches)setTimeout(()=>lens.classList.remove('show'),650)})});\n\nlet lastArea=null;qa('.art-area').forEach(area=>area.addEventListener('click',()=>{lastArea=area}));\nconst foundCounter=q('#foundCount');if(foundCounter)new MutationObserver(()=>{const n=parseInt(foundCounter.textContent,10)||0;if(n){foundCounter.classList.remove('found-pop');void foundCounter.offsetWidth;foundCounter.classList.add('found-pop');burstFrom(lastArea?.querySelector('.marker')||lastArea,15);if(navigator.vibrate)navigator.vibrate([18,24,18])}}).observe(foundCounter,{childList:true,characterData:true,subtree:true});\nq('#hint')?.addEventListener('click',()=>{const zones=[[.51,.23],[.28,.65],[.25,.79]];let idx=Math.min(parseInt(q('#foundCount')?.textContent,10)||0,2);try{idx=zone.findIndex((_,i)=>!found.has(i));if(idx<0)return}catch{}const z=zones[idx];qa('.art-area').forEach(area=>{const ring=document.createElement('i');ring.className='hint-ring';ring.style.left=z[0]*100+'%';ring.style.top=z[1]*100+'%';area.appendChild(ring);setTimeout(()=>ring.remove(),1600)})});\n\n// Preserve the original 3D model; add a clear hands-on prompt for its existing controls.\nconst modelPanel=q('.model-status'),modelScreen=q('#model');if(modelPanel){const prompt=document.createElement('div');prompt.className='model-prompt';prompt.innerHTML='<i>↻</i><span>先拖动旋转建筑，再试试「揭开屋顶」和「隐藏围护面」</span>';modelPanel.appendChild(prompt)}if(modelScreen){const tip=document.createElement('div');tip.className='drag-tip';tip.textContent='按住并拖动 · 旋转大乘阁';modelScreen.appendChild(tip);const hide=()=>tip.classList.add('hide');modelScreen.addEventListener('pointerdown',hide,{once:true});frame?.addEventListener('load',()=>{try{frame.contentDocument?.addEventListener('pointerdown',hide,{once:true})}catch{}})}\n['#roofBtn','#wallBtn','#resetModel'].forEach(s=>q(s)?.addEventListener('click',e=>{burstFrom(e.currentTarget,8);if(navigator.vibrate)navigator.vibrate(12)}));\n\n// A soft moving lantern and delayed sonar pulse make the hall an active search scene.\nconst hall=q('#hall'),hallStage=q('.hall-stage');if(hall&&hallStage){const lantern=document.createElement('div');lantern.className='hall-lantern';lantern.setAttribute('aria-hidden','true');hallStage.appendChild(lantern);const instruction=document.createElement('div');instruction.className='search-instruction';instruction.innerHTML='<b>寻画提示</b><br>移动鼠标或手指，沿殿内画面细看缂丝画卷。';hallStage.appendChild(instruction);let idle=0,moved=false;hall.addEventListener('pointermove',e=>{const r=hall.getBoundingClientRect();hall.style.setProperty('--lantern-x',(e.clientX-r.left)+'px');hall.style.setProperty('--lantern-y',(e.clientY-r.top)+'px');moved=true;hall.classList.remove('searching');clearTimeout(idle);idle=setTimeout(()=>{if(moved){hall.classList.add('searching');setTimeout(()=>hall.classList.remove('searching'),1800)}},4200)});const watch=new MutationObserver(()=>{if(hall.classList.contains('active')){moved=false;clearTimeout(idle);idle=setTimeout(()=>hall.classList.add('searching'),6500)}else hall.classList.remove('searching')});watch.observe(hall,{attributes:true,attributeFilter:['class']});q('#artTarget')?.addEventListener('click',e=>{hall.classList.remove('searching');burstFrom(e.currentTarget,20);if(navigator.vibrate)navigator.vibrate([22,30,22])})}\n})();";d.body.appendChild(addon);
