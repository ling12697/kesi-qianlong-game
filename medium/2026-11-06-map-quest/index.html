extContent=item.text;box.classList.add('show');clearTimeout(timer[key]);timer[key]=setTimeout(()=>box.classList.remove('show'),3400)}\nconst hero=q('.cover-hero');const originalArt=q('#end img');if(hero&&originalArt){const img=originalArt.cloneNode(false);img.alt='缂丝无量寿尊佛文物原图';hero.appendChild(img)}\nconst mapCount=q('#mapCount');if(mapCount){new MutationObserver(()=>{if(mapCount.textContent.trim()==='4 / 4')announceClue('map')}).observe(mapCount,{childList:true,characterData:true,subtree:true})}\nq('#mapNext')?.addEventListener('click',()=>setTimeout(()=>announceClue('map'),250));\nq('#compareNext')?.addEventListener('click',()=>setTimeout(()=>announceClue('art'),250));\nq('#complete')?.addEventListener('click',()=>setTimeout(()=>announceClue('hall'),250));\n\n// Turn the map into a small investigation: inspect a sealed record, file it, then make a chronology judgment.\nconst mapInfo=[\n {name:'准噶尔',text:'乾隆二十年（1755），清廷平定达瓦齐。请把这条军事治理线索单独记录。宫廷佛像改样记录出现得更早，不能把两件事写成前后因果。'},\n {name:'蒙古',text:'藏传佛教在蒙古地区社会文化中影响深远，清廷重视相关宗教政策。将它作为理解清代宫廷艺术背景的一条线索。'},\n {name:'西藏',text:'藏传佛教宗教文化与清代宫廷艺术存在值得观察的联系。先记录这层文化背景，不直接推断它就是某件作品改样的原因。'},\n {name:'承德 / 北京',text:'承德普宁寺及北京须弥灵境，为观察清代宗教建筑与供奉背景提供线索。把建筑、供奉与作品的关联留待后续关卡继续核对。'}\n];\n// Map level replaced by quest module.\nconst zoom=q('#detailZoom'), scaleLabel=q('#detailScale');let scale=1.3;const pan=new Map();\nfor(const side of ['left','right']){const source=q('.art-area[data-art=\"'+side+'\"] img'),target=q('#detail'+(side==='left'?'Left':'Right'));if(source&&target)target.src=source.src;pan.set(side,{x:0,y:0,start:null});}\nfunction renderZoom(){if(scaleLabel)scaleLabel.textContent=Math.round(scale*100)+'%';qa('.zoom-pane img').forEach(img=>{const side=img.id==='detailLeft'?'left':'right',p=pan.get(side);img.style.transform='translate('+p.x+'px,'+p.y+'px) scale('+scale+')'})}\nq('#detailsOpen')?.addEventListener('click',()=>{zoom?.classList.add('show');scale=1.3;pan.forEach(p=>{p.x=0;p.y=0});renderZoom()});\nq('#detailClose')?.addEventListe ndingClientRect();burstAt(r.left+r.width/2,r.top+r.height/2,n)}\nqa('.mapspot').forEach(spot=>spot.addEventListener('click',()=>{if(spot.classList.contains('done')){burstFrom(spot,12);if(navigator.vibrate)navigator.vibrate(18)}}));\n\n// A movable lens lets visitors inspect both authentic images before choosing a difference.\nqa('.art-area').forEach(area=>{const img=area.querySelector('img');if(!img)return;const lens=document.createElement('span');lens.className='touch-lens';lens.setAttribute('aria-hidden','true');lens.style.backgroundImage='url(\"'+(img.currentSrc||img.src)+'\")';area.appendChild(lens);const move=e=>{const r=area.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top));lens.style.left=x+'px';lens.style.top=y+'px';lens.style.backgroundSize='280% 280%';lens.style.backgroundPosition=(r.width?x/r.width*100:50)+'% '+(r.height?y/r.height*100:50)+'%';lens.classList.add('show')};area.addEventListener('pointermove',move);area.addEventListener('pointerdown',move);area.addEventListener('pointerleave',()=>lens.classList.remove('show'));area.addEventListener('pointerup',()=>{if(matchMedia('(pointer: coarse)').matches)setTimeout(()=>lens.classList.remove('show'),650)})});\n\nlet lastArea=null;qa('.art-area').forEach(area=>area.addEventListener('click',()=>{lastArea=area}));\nconst foundCounter=q('#foundCount');if(foundCounter)new MutationObserver(()=>{const n=parseInt(foundCounter.textContent,10)||0;if(n){foundCounter.classList.remove('found-pop');void foundCounter.offsetWidth;foundCounter.classList.add('found-pop');burstFrom(lastArea?.querySelector('.marker')||lastArea,15);if(navigator.vibrate)navigator.vibrate([18,24,18])}}).observe(foundCounter,{childList:true,characterData:true,subtree:true});\nq('#hint')?.addEventListener('click',()=>{const zones=[[.51,.23],[.28,.65],[.25,.79]];let idx=Math.min(parseInt(q('#foundCount')?.textContent,10)||0,2);try{idx=zone.findIndex((_,i)=>!found.has(i));if(idx }\n\n// B: connect documentary evidence with the subject it supports, without drawing a causal chain.\nconst linkPairs=[\n {id:'lama',label:'《喇嘛说》摘句',text:'“兴黄教，即所以安众蒙古”\\n乾隆五十七年（1792）',target:'mongol',targetText:'蒙古相关宗教政策',explain:'这段话出自乾隆五十七年（1792）的《喇嘛说》，应归入蒙古相关宗教政策背景。'},\n {id:'records',label:'造办处档案',text:'乾隆十九年十二月\\n下旨按旧样改制缂丝佛像',target:'work',targetText:'缂丝佛像制作记录',explain:'故宫研究引造办处档案，记录了乾隆十九年开始的画样调整。'},\n {id:'punning',label:'承德寺院资料',text:'普宁寺始建于乾隆二十年（1755）',target:'chengde',targetText:'承德佛教建筑',explain:'承德文物部门资料记载普宁寺始建于1755年；这条建筑资料与画样档案分开记录。'}\n];\nfunction buildConnections(){openActivity('历史关系连线','拖动左侧史料卡，接到它能说明的主题。错误连线会退回；三条线都只表示史料对应，不代表事件之间有因果。','蒙古区域 · 连接任务',sourceLink('故宫《喇嘛说》','https://www.dpm.org.cn/lemmas/243404.html')+' · '+sourceLink('故宫院刊改样档案研究',sourceUrls.archive)+' · '+sourceLink('承德文物局普宁寺资料',sourceUrls.chengde));body.innerHTML='<div class=\"connect-board\"><div class=\"connect-cards\"></div><svg class=\"connect-lines\" viewBox=\"0 0 38 250\" aria-hidden=\"true\"></svg><div class=\"connect-targets\"></div></div>';\nconst cards=q('.connect-cards'),targets=q('.connect-targets');for(const item of linkPairs){const card=make('div','connect-card','<em>'+item.label+'</em>'+item.text);card.tabIndex=0;card.dataset.linkId=item.id;cards.appendChild(card);const target=make('button','connect-target','<span>'+item.targetText+'</span>');target.dataset.targetId=item.target;target.type='button';targets.appendChild(target)}\nlet activeCard=null,ghost=null,line=null,dragStart=null;const matches=Object.fromEntries(state.links.map(x=>[x.id,x.target]));function paintLink(item,card,target){card.classList.add('connected');target.classList.add('connected');const a=card.getBoundingClientRect(),b=target.getBoundingClientRect();inkLine(a.right,a.top+a.height/2,b.left,b.top+b.height/2)}\nfor(const item of linkPairs){const card=cards.querySelector('[data-link-id=\"'+item.id+'\"]'),target=targets.querySelector('[data-target-id=\"'+item.target+'\"]');if(matches[item.id]===item.target)paintLink(item,card,target)}\nfunction finishLink(item,card,target){if(matches[item.id])return;if(target?.dataset.targetId===item.target){matches[item.id]=item.target;state.links=Object.entries(matches).map(([id,t])=>({id,target:t}));save();paintLink(item,card,target);toast(item.explain,'ok');play('ok');if(linkPairs.every(x=>matches[x.id]===x.target))setTimeout(()=>updateStepDone(1),650)}else{card.classList.add('quest-shake');toast('这条史料不支持该主题，卡片回到原位。','try');play('bad');setTimeout(()=>card.classList.remove('quest-shake'),320)}}\nfunction beginDrag(e,card){if(card.classList.contains('connected'))return;e.preventDefault();activeCard=card;dragStart={x:e.clientX,y:e.clientY};card.classList.add('selected');ghost=make('div','drag-ghost',card.innerHTML);document.body.appendChild(ghost);moveGhost(e);const boardSvg=q('.ink-svg');line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('class','ink-path');boardSvg.appendChild(line);document.addEventListener('pointermove',dragMove);document.addEventListener('pointerup',dragEnd,{once:true})}\nfunction moveGhost(e){if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}if(line&&activeCard){const r=activeCard.getBoundingClientRect();line.setAttribute('d','M '+(r.left+r.width/2)+' '+(r.top+r.height/2)+' Q '+e.clientX+' '+(r.top+10)+' '+e.clientX+' '+e.clientY)}}\nfunction dragMove(e){moveGhost(e)}function dragEnd(e){document.removeEventListener('pointermove',dragMove);const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.connect-target');if(activeCard){if(Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>5)finishLink(linkPairs.find(x=>x.id===activeCard.dataset.linkId),activeCard,target);activeCard.classList.remove('selected')}ghost?.remove();line?.remove();activeCard=ghost=line=dragStart=null}\ncards.querySelectorAll('.connect-card').forEach(card=>{card.addEventListener('pointerdown',e=>beginDrag(e,card));card.addEventListener('click',()=>{if(card.classList.contains('connected'))return;cards.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));card.classList.add('selected');activeCard=card});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click()}})});targets.querySelectorAll('.connect-target').forEach(target=>target.addEventListener('click',()=>{if(!activeCard){toast('先选中或拖动一张史料卡。');return}finishLink(linkPairs.find(x=>x.id===activeCard.dataset.linkId),activeCard,target);activeCard.classList.remove('selected');activeCard=null}));}\n\n// C: sort five dated stages from the Palace Museum's journal article. Pointer and click-to-place both work.\nconst events=[\n {id:'q09',date:'乾隆九年',text:'根据题记与故宫研究，推定简本仿制卢楞伽款佛像。'},\n {id:'q19a',date:'乾隆十九年十二月初一',text:'造办处记录：按旧样着做缂丝佛像。'},\n {id:'q19b',date:'乾隆十九年十二月初六至十八',text:'画样增添日月、飞仙、十八罗汉，并调整四天王位置。'},\n {id:'q20',date:'乾隆二十年正月初十',text:'档案记载：准按改定画样缂织。'},\n {id:'q21',date:'乾隆二十一年七月十五',text:'档案记载：苏州织造送到缂丝佛像。'}\n];\nfunction buildTimeline(){openActivity('整理缂丝画样时间轴','拖动卡片，按清宫档案记载的年号、月份和日期排序。放错会退回原位。此时间轴记录作品制作，不是西藏地方事件，也不把背景写成因果。','档案整理 · 时间排序',sourceLink('故宫博物院院刊 2024年第9期',sourceUrls.archive));body.innerHTML='<div class=\"timeline-board\"><div class=\"timeline-track\"></div><div class=\"timeline-bank\"></div></div>';\nconst track=q('.timeline-track'),bank=q('.timeline-bank'),placed={};state.timeline.forEach(x=>{if(x.slot>=0&&x.slot<events.length)placed[x.slot]=x.id});\nfunction makeSlot(i){const s=make('div','timeline-slot', '放入该顺序的档案卡');s.dataset.slot=String(i);s.dataset.label=String(i+1).padStart(2,'0');track.appendChild(s);return s}\nconst slots=events.map((_,i)=>makeSlot(i));function renderFilled(){for(let i=0;i<slots.length;i++){const event=events.find(x=>x.id===placed[i]);slots[i].classList.toggle('filled',!!event);slots[i].innerHTML=event?'<strong>'+event.date+'</strong> · '+event.text:'放入第 '+(i+1)+' 项档案';slots[i].dataset.label=String(i+1).padStart(2,'0')}}\nfunction assess(card,slot){if(!card||!slot)return;const item=events.find(x=>x.id===card.dataset.eventId),i=Number(slot.dataset.slot);if(!item)return;if(item.id===events[i].id){const previous=Object.keys(placed).find(k=>placed[k]===item.id);if(previous!==undefined)delete placed[previous];placed[i]=item.id;state.timeline=Object.entries(placed).map(([s,id])=>({slot:Number(s),id}));save();renderFilled();bank.querySelectorAll('.timeline-card').forEach(c=>c.hidden=Object.values(placed).includes(c.dataset.eventId));toast('档案吸附到时间轴。','ok');play('ok');if(Object.keys(placed).length===events.length)setTimeout(()=>updateStepDone(2),600)}else{slot.classList.add('wrong');toast('日期次序不合，卡片回到原位。','try');play('bad');setTimeout(()=>slot.classList.remove('wrong'),350)}}\nfor(const item of events){const card=make('div','timeline-card','<strong>'+item.date+'</strong>'+item.text);card.dataset.eventId=item.id;card.tabIndex=0;bank.appendChild(card);card.addEventListener('pointerdown',e=>{e.preventDefault();card.classList.add('selected');let ghost=make('div','drag-ghost','<strong>'+item.date+'</strong>'+item.text);document.body.appendChild(ghost);const mv=x=>{ghost.style.left=x.clientX+'px';ghost.style.top=x.clientY+'px'};mv(e);document.addEventListener('pointermove',mv);document.addEventListener('pointerup',function up(x){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);const slot=document.elementFromPoint(x.clientX,x.clientY)?.closest('.timeline-slot');assess(card,slot);ghost.remove();card.classList.remove('selected')},{once:true})});card.addEventListener('click',()=>{bank.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));card.classList.add('selected')});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click()}})}\nslots.forEach(slot=>{slot.addEventListener('click',()=>{const card=bank.querySelector('.timeline-card.selected:not([hidden])');if(card){assess(card,slot);card.classList.remove('selected')}});slot.tabIndex=0;slot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();slot.click()}})});renderFilled();bank.querySelectorAll('.timeline-card').forEach(c=>c.hidden=Object.values(placed).includes(c.dataset.eventId));}\n\n// D: a labelled spatial diagram, not an architectural reconstruction or a duplicate 3D model.\nfunction buildTemple(){openActivity('承德普宁寺 · 空间寻线','点击导览图上的三处印记，寻找建筑布局、藏式部分和主体阁楼的关系。图为关系示意，不是测绘图或复原模型。','承德探索 · 场景寻物',sourceLink('承德市文物局《普宁寺景区》',sourceUrls.chengde)+' · '+sourceLink('承德市政府普宁寺介绍','https://www.chengde.gov.cn/art/2021/8/31/art_362_791033.html'));body.innerHTML='<div class=\"temple-scene\"><svg viewBox=\"0 0 900 420\" role=\"group\" aria-label=\"普宁寺空间关系示意图\"><text class=\"north-arrow\" x=\"825\" y=\"36\">北 ↑</text><rect x=\"35\" y=\"48\" width=\"830\" height=\"326\" rx=\"12\" fill=\"#d8c5a2\" stroke=\"#98794e\" stroke-width=\"3\"/><text x=\"55\" y=\"75\" font-size=\"15\">后半部 · 藏式建筑区域</text><rect x=\"75\" y=\"90\" width=\"750\" height=\"120\" rx=\"10\" fill=\"#cfb68c\" stroke=\"#876942\" stroke-width=\"2\"/><g class=\"temple-zone\" data-scene=\"rear\" tabindex=\"0\" role=\"button\" aria-label=\"查找后部藏式建筑线索\"><rect x=\"93\" y=\"108\" width=\"230\" height=\"78\" rx=\"8\" fill=\"#ead8b4\" stroke=\"#9d7947\" stroke-width=\"2\"/><text x=\"208\" y=\"145\" text-anchor=\"middle\" font-size=\"17\">后部院落</text><circle class=\"pin\" cx=\"208\" cy=\"169\" r=\"8\" fill=\"#a44231\"/></g><g class=\"temple-zone\" data-scene=\"pavilion\" tabindex=\"0\" role=\"button\" aria-label=\"查找大乘之阁线索\"><rect x=\"355\" y=\"92\" width=\"190\" height=\"115\" rx=\"8\" fill=\"#b48350\" stroke=\"#79432d\" stroke-width=\"4\"/><path d=\"M340 94L450 48L560 94Z\" fill=\"#8c4b32\" stroke=\"#6a382b\" stroke-width=\"3\"/><text x=\"450\" y=\"141\" text-anchor=\"middle\" fill=\"#fff1d2\" font-size=\"17\">大乘之阁</text><text x=\"450\" y=\"165\" text-anchor=\"middle\" fill=\"#fff1d2\" font-size=\"10\">主体建筑</text><circle class=\"pin\" cx=\"450\" cy=\"187\" r=\"8\" fill=\"#f5d793\"/></g><g class=\"temple-zone\" data-scene=\"front\" tabindex=\"0\" role=\"button\" aria-label=\"查找前部汉式布局线索\"><rect x=\"590\" y=\"108\" width=\"230\" height=\"78\" rx=\"8\" fill=\"#ead8b4\" stroke=\"#9d7947\" stroke-width=\"2\"/><text x=\"705\" y=\"145\" text-anchor=\"middle\" font-size=\"17\">前部院落</text><circle class=\"pin\" cx=\"705\" cy=\"169\" r=\"8\" fill=\"#a44231\"/></g><text x=\"55\" y=\"245\" font-size=\"14\">前半部 · 汉式伽蓝七堂布局</text><rect x=\"75\" y=\"260\" width=\"750\" height=\"74\" rx=\"8\" fill=\"#e8d5ae\" stroke=\"#9b815a\" stroke-width=\"2\"/><path d=\"M145 280h90v34h-90zM270 280h90v34h-90zM385 280h130v34H385zM540 280h90v34h-90zM665 280h90v34h-90z\" fill=\"#b99462\" stroke=\"#76543a\" stroke-width=\"2\"/><text x=\"450\" y=\"360\" text-anchor=\"middle\" font-size=\"12\">南侧入口　···　院落空间关系示意，不表示精确尺度</text></svg><div class=\"temple-reveal\" id=\"templeReveal\">移动并点击三个红印，线索会在这里逐条展开。</div><p class=\"scene-foot\">据承德市文物局对普宁寺布局的介绍绘制简化关系图；仅用于探索前部与后部空间，不作为建筑复原。</p></div>';\nconst clues={front:'前半部采用汉式伽蓝七堂布局。',rear:'后半部仿西藏桑耶寺式的藏式建筑布局。',pavilion:'大乘之阁是普宁寺主体建筑，阁内供奉大型木雕千手千眼观音像。'};const reveal=q('#templeReveal');function foundScene(g){const id=g.dataset.scene;if(state.scene.includes(id))return;state.scene.push(id);g.classList.add('found');save();reveal.textContent=clues[id];reveal.classList.add('map-flash');setTimeout(()=>reveal.classList.remove('map-flash'),650);play('ok');if(state.scene.length===3){updateStepDone(3)}}q('.temple-scene').querySelectorAll('.temple-zone').forEach(g=>{g.classList.toggle('found',state.scene.includes(g.dataset.scene));g.addEventListener('click',()=>foundScene(g));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();foundScene(g)}})});}\n\n// The final activity sorts evidence into two parallel strands, avoiding a false cause-and-effect chain.\nconst finalItems=[\n {id:'geo',title:'准噶尔地区档案',kind:'背景线索',lane:'context'},\n {id:'policy',title:'《喇嘛说》蒙古政策文字',kind:'背景线索',lane:'context'},\n {id:'temple',title:'普宁寺空间与建筑资料',kind:'背景线索',lane:'context'},\n {id:'art',title:'缂丝佛像改样与制作记录',kind:'制作档案',lane:'work'}\n];\nfunction showDossier(){if(current()!==-1||state.final.complete)return;openActivity('最后任务 · 归整四条证据','拖动每条线索到它所属的证据栏。背景资料与缂丝制作档案并列整理，不要把它们连成未经证明的直接因果。','卷宗整理 · 拖放归类',sourceLink('故宫院刊制作档案',sourceUrls.archive)+' · '+sourceLink('故宫《喇嘛说》',sourceUrls.lama)+' · '+sourceLink('承德文物局普宁寺资料',sourceUrls.chengde));body.innerHTML='<div class=\"dossier-board\"><div class=\"dossier-shelf\"></div><div class=\"dossier-lane\" data-lane=\"context\"><strong>历史背景与地域资料</strong></div><div class=\"dossier-lane\" data-lane=\"work\"><strong>缂丝佛像制作记录</strong></div></div><p class=\"activity-feedback\" id=\"dossierFeedback\" aria-live=\"polite\">把四条线索放入相应证据栏。</p><div id=\"dossierConclusion\" hidden></div>';\nconst shelf=q('.dossier-shelf'),placed={...state.final.placed};function placeChip(item,chip,lane){if(!lane)return;if(lane.dataset.lane!==item.lane){toast('这条线索属于另一类证据；请放回任务卷再试。','try');play('bad');return}if(placed[item.id])return;placed[item.id]=item.lane;state.final.placed=placed;save();const a=chip.getBoundingClientRect(),b=lane.getBoundingClientRect();inkLine(a.left+a.width/2,a.top+a.height/2,b.left+b.width/2,b.top+30);lane.appendChild(chip);chip.classList.add('connected');chip.style.cursor='default';toast('归档正确，证据线已接通。','ok');play('ok');if(Object.keys(placed).length===finalItems.length)finishDossier()}\nfor(const item of finalItems){const chip=make('div','dossier-chip','<em>'+item.kind+'</em>'+item.title);chip.dataset.finalId=item.id;chip.tabIndex=0;const savedLane=placed[item.id]?q('.dossier-lane[data-lane=\"'+placed[item.id]+'\"]'):null;(savedLane||shelf).appendChild(chip);if(placed[item.id])chip.classList.add('connected');chip.addEventListener('pointerdown',e=>{if(placed[item.id])return;e.preventDefault();const ghost=make('div','drag-ghost','<em>'+item.kind+'</em>'+item.title);document.body.appendChild(ghost);const mv=x=>{ghost.style.left=x.clientX+'px';ghost.style.top=x.clientY+'px'};mv(e);document.addEventListener('pointermove',mv);document.addEventListener('pointerup',function up(x){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);const lane=document.elementFromPoint(x.clientX,x.clientY)?.closest('.dossier-lane');placeChip(item,chip,lane);ghost.remove()},{once:true})});chip.addEventListener('click',()=>{if(placed[item.id])return;shelf.dataset.selected=item.id;shelf.querySelectorAll('.dossier-chip').forEach(x=>x.classList.toggle('selected',x===chip))})}\nqa('.dossier-lane').forEach(lane=>{lane.addEventListener('click',e=>{const id=shelf.dataset.selected,chip=id&&q('[data-final-id=\"'+id+'\"]'),item=finalItems.find(x=>x.id===id);if(chip&&item)placeChip(item,chip,lane)});lane.addEventListener('pointerup',e=>{if(!e.target.closest('.dossier-chip')){const id=shelf.dataset.selected,chip=id&&q('[data-final-id=\"'+id+'\"]'),item=finalItems.find(x=>x.id===id);if(chip&&item)placeChip(item,chip,lane)}})});if(Object.keys(placed).length===finalItems.length)finishDossier()}\nfunction inkLine(x1,y1,x2,y2){const svgInk=q('.ink-svg'),p=document.createElementNS('http://www.w3.org/2000/svg','path'),w=window.innerWidth,h=window.innerHeight;svgInk.setAttribute('viewBox','0 0 '+w+' '+h);const len=Math.hypot(x2-x1,y2-y1);p.setAttribute('pathLength','1');p.setAttribute('class','ink-path');p.setAttribute('d','M '+x1+' '+y1+' Q '+((x1+x2)/2)+' '+(Math.min(y1,y2)-24)+' '+x2+' '+y2);svgInk.appendChild(p);setTimeout(()=>p.remove(),1700)}\nfunction finishDossier(){if(state.final.complete)return;state.final.complete=true;save();updateUI();const done=make('div','activity-feedback ok','卷宗已归整：准噶尔区域、蒙古政策与普宁寺资料构成历史背景；另有乾隆九年至二十一年的缂丝画样制作记录。现有材料可并列参照，但不能证明每项边疆事件都直接导致了该佛像改样。');body.appendChild(done);const next=make('button','btn','前往佛像原画 →');next.style.marginTop='10px';body.appendChild(next);next.addEventListener('click',()=>{closeActivity();q('#mapNext').disabled=false;q('#mapNext').click()});inkLine(window.innerWidth*.2,window.innerHeight*.64,window.innerWidth*.8,window.innerHeight*.64);stamp('证据归卷');toast('第一关完成 · 线索已整理','ok')}\n\nfunction activateMap(){quest.classList.add('visible');updateUI();applyTransform()}\nconst observe=new MutationObserver(()=>{const active=map.classList.contains('active');quest.classList.toggle('visible',active);if(active){updateUI();applyTransform()}});observe.observe(map,{attributes:true,attributeFilter:['class']});if(map.classList.contains('active'))activateMap();\n// Continue from saved progress even after a refresh; nothing from levels 2 and 3 is reset.\nif(state.final.complete){q('#mapNext').disabled=false;q('#mapCount').textContent='4 / 4'}\n})();\n";d.body.appendChild(js);const title=d.querySelector("title");if(title)title.textContent="御前观织 · 中级篇《御旨与佛像》· 地图任务重构版"}frame.addEventListener("load",()=>{installed=false;setTimeout(inject,50)});setTimeout(()=>{inject();if(!installed)setTimeout(()=>{inject();if(!installed)error.classList.add("show")},6000)},1000)})();</script></body></html>
