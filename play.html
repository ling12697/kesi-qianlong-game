const c=$('fx'),ctx=c.getContext('2d'),particles=[];let width=0,height=0,ts=performance.now();
function fit(){const r=c.getBoundingClientRect();const pr=Math.min(devicePixelRatio||1,2);width=r.width;height=r.height;c.width=width*pr;c.height=height*pr;ctx.setTransform(pr,0,0,pr,0,0)}window.addEventListener('resize',fit);fit();
function emit(x,y,n=9){for(let k=0;k<n;k++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*2.5-1,life:50+Math.random()*40,age:0,r:1.1+Math.random()*2.6})}
function fx(t){ctx.clearRect(0,0,width,height);if(Math.random()<.30&&particles.length<90)particles.push({x:Math.random()*width,y:height*.15+Math.random()*height*.76,vx:-.1-Math.random()*.22,vy:-.22-Math.random()*.35,life:160,age:0,r:.7+Math.random()*1.4});for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.age++;const a=Math.min(.65,Math.max(0,(p.life-p.age)/p.life*.75));ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,215,138,${a})`;ctx.fill();if(p.age>p.life)particles.splice(i,1)}requestAnimationFrame(fx)}requestAnimationFrame(fx);
function beep(f=660,d=.07){if(muted)return;try{let ac=window.__soundctx||(window.__soundctx=new (window.AudioContext||window.webkitAudioContext)()),o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;o.type='sine';v.gain.setValueAtTime(.025,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function hideSpeech(){$('say').hidden=true}
function switchTo(i){cur=i;const x=chapters[i];$('world').style.backgroundImage=`url("${bg[x.back]}")`;$('figure').src=char[x.actor];$('era').textContent=x.era;$('chapter').textContent=x.chapter;$('title').innerHTML=x.title.replace(/\\n/g,'<br>');$('desc').textContent=x.desc;$('tags').innerHTML=x.tags.map(t=>'<span>'+t+'</span>').join('');$('go').href=x.href;$('go').innerHTML=x.button+' <span class="arrow">➜</span>';$('actorlabel').textContent=x.label;document.querySelectorAll('.portal').forEach((p,k)=>{p.classList.toggle('active',i===k);p.setAttribute('aria-pressed',i===k?'true':'false')});hideSpeech();lastSwitch=Date.now();beep(520+i*120);emit(width*.58,height*.52,20)}
document.querySelectorAll('.portal').forEach(btn=>btn.addEventListener('click',()=>switchTo(+btn.dataset.i)));
function dialogue(){const x=chapters[cur];$('say').hidden=false;$('say').textContent=x.words[speech++%x.words.length];$('actor').classList.remove('tap');void $('actor').offsetWidth;$('actor').classList.add('tap');points++;$('points').textContent='✦ 时空丝线 '+points;beep(800,.09);emit(width*.27,height*.63,18)}
$('actor').addEventListener('click',dialogue);$('actor').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dialogue()}});
$('stage').addEventListener('pointerdown',e=>{if(e.target.closest('#actor,#go'))return;const r=c.getBoundingClientRect();emit(e.clientX-r.left,e.clientY-r.top,7)});
$('music').addEventListener('click',()=>{muted=!muted;$('music').textContent=muted?'♫ 音效关':'♫ 音效开';beep(610)});
$('how').addEventListener('click',()=>{hideSpeech();$('say').hidden=false;$('say').textContent='下方选难度，点人物听对白，按金色按钮进游戏。三关都能自由进入！';beep(760)});
switchTo(0);
})();
