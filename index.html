<div id="wrap">
<header>

 <canvas id="game" width="1200" height="620" aria-label="可交互的清代缂丝工坊"></canvas>

 <div id="curtain"><section class="intro" id="intro"><div class="goldsmall">清代工艺 · 互动体验</div><h2>一丝入画</h2><p>乾隆观织，画师递稿。<br>化身缂丝织工，亲手完成经线、描稿、投梭与修整。<br>人物会行走、交流和织造，每一步由你操作。</p><button id="start" class="mainbtn">进入缂丝工坊 →</button><div class="disclaimer">历史主题教学情境 · 乾隆观织故事为艺术化虚构</div></section></div>

</div>

 let grad=g.createLinearGradient(0,0,0,550);grad.addColorStop(0,'#eadbbb');grad.addColorStop(.72,'#cdb994');grad.addColorStop(1,'#b5a17c');rect(0,0,W,H,grad);
 // watermark texture rays
 g.fillStyle='#fff4da20';poly([[290,0],[650,0],[790,495],[380,485]],'#fff7e832');
 rect(0,0,W,43,'#354e4a');rect(0,40,W,12,'#947a58');for(let i=0;i<9;i++){rect(i*149,0,13,215,'#7b5a40');line(i*149+4,52,i*149+4,214,'#d0a67570',2)}

 }

 if(state.part==='pass'&&near(p,state.shuttleX,423,60)){state.shuttleDragging=true;state.drag={kind:'shuttle'};return}
 if(state.part==='beat'&&near(p,798,333,71)){state.cycle++;state.part='pedal';burst(667,411,9);sound(370,.08,'triangle');setTimeout(()=>sound(480,.06,'triangle'),70);if(state.cycle===5){success('织成了！彩色纬线按区域交织完成')}else{say(`第 ${state.cycle} 组彩纬已织入`);describe()}return}}
 if(state.stage===3){for(let i=0;i<4;i++){if(!state.trim[i]&&near(p,...trimPts[i],32)){state.trim[i]=true;burst(...trimPts[i],12);sound(740,.08,'triangle');say('线头修整完成');if(state.trim.every(Boolean))success('修整完成！你的缂丝作品已完成');else describe();return}}}
}
function checkTrace(p){if(state.stage!==1||state.hand!=='trace'||state.done)return;if(state.trace>=tracePts.length)return;let q=tracePts[state.trace];if(near(p,q[0],q[1],30)){state.trace++;sound(330+state.trace*53,.065);burst(q[0],q[1],4);if(state.trace===tracePts.length){success('画稿描样完成！');return}describe()}}
function move(p){pointer.x=p.x;pointer.y=p.y;if(state.stage===1&&state.traceMoving)checkTrace(p)}
function release(p){if(state.stage===0&&state.drag?.kind==='warp'){let i=state.drag.i;if(near(p,warpTarget[i],282,43)){state.warp[i]=true;burst(warpTarget[i],282,14);sound(590+i*77,.1);say('经线成功入位');if(state.warp.every(Boolean))success('经线排列完成！');else describe()}else{say('把丝卷拖至上方对应编号处')}state.drag=null;return}
 if(state.stage===2&&state.drag?.kind==='shuttle'){if(p.x>713&&Math.abs(p.y-423)<98){state.part='beat';state.shuttleX=735;sound(520,.12);say('穿纬成功，点击右侧拨子打紧');describe()}else{state.shuttleX=555;say('沿水平箭头拖动小梭穿过经线')}state.drag=null;state.shuttleDragging=false;return}
 state.traceMoving=false;state.drag=null}
C.addEventListener('pointerdown',e=>{e.preventDefault();C.setPointerCapture?.(e.pointerId);pointer.down=true;let p=coords(e);move(p);press(p)});
C.addEventListener('pointermove',e=>{let p=coords(e);move(p)});
C.addEventListener('pointerup',e=>{e.preventDefault();pointer.down=false;let p=coords(e);move(p);release(p)});
C.addEventListener('pointercancel',()=>{pointer.down=false;state.drag=null;state.traceMoving=false;state.shuttleDragging=false});
$('start').addEventListener('click',()=>{$('curtain').classList.add('hidden');state.warp=[false,false,false,false];state.cycle=0;state.trim=[false,false,false,false];state.win=false;setStage(0);say('欢迎来到缂丝工坊！');sound(390,.17)});
$('next').addEventListener('click',()=>{if(!state.done)return;sound(720,.15);if(state.stage===4){$('curtain').classList.remove('hidden');$('intro').innerHTML='<div class="goldsmall">清代工艺 · 互动体验</div><h2>一丝入画</h2><p>重返缂丝工坊，再织一幅花卉纹样。</p><button id="restart" class="mainbtn">再次进入工坊 →</button><div class="disclaimer">历史主题教学情境 · 并非实际乾隆观织事件</div>';$('restart').addEventListener('click',()=>{$('curtain').classList.add('hidden');state.warp=[false,false,false,false];state.cycle=0;state.trim=[false,false,false,false];state.win=false;setStage(0)});state.stage=-1;describe();return}setStage(state.stage+1)});
$('sound').addEventListener('click',()=>{mute=!mute;$('sound').textContent=mute?'♪ 声音关':'♫ 声音开';if(!mute)sound(550,.14)});
$('help').addEventListener('click',()=>{say('玩法：在场景中拖丝卷、点画师、描花、踩踏投梭、修线头');sound(400,.09)});
function winOverlay(){setTimeout(()=>{say('初识缂丝 · 御前巧匠！');burst(659,413,52)},350)}
requestAnimationFrame(frame);describe();
})();
